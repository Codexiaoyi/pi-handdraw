<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>✏️ 实时画布</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, "PingFang SC", sans-serif; }
  .stage { position: relative; width: 100vw; height: 100vh; background: #fdf6e3; overflow: hidden; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(253,246,227,0.94); border: 1.5px solid #d5c9a8; border-radius: 999px;
    padding: 6px 18px; font-size: 14px; color: #7d7461;
    display: flex; gap: 14px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,0.12); z-index: 10; user-select: none;
  }
  .toast .label { color: #b4562c; font-weight: 600; }
  .toast .board { color: #7d6608; font-weight: 600; }
  .controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(253,246,227,0.94); border: 1.5px solid #d5c9a8; border-radius: 999px;
    padding: 6px 10px; display: flex; gap: 6px; align-items: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12); z-index: 10; user-select: none;
  }
  button, select { border: 1.5px solid #c9bfa6; background: #fdf6e3; color: #6b6350; border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer; }
  button:hover, select:hover { background: #f3ecd9; }
  /* 钢笔指示器（变换由 JS 每帧写入，禁掉 CSS 过渡避免滞后抖动） */
  #pen { pointer-events: none; filter: drop-shadow(1px 2px 2px rgba(60,40,20,0.35)); }
</style>
</head>
<body>
<div class="stage">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <g id="content"></g>
    <!--
      钢笔：笔尖在 (0,0)，笔身沿 -y 方向；JS 里 translate 到笔画点 + 固定倾角。
      结构：金色笔尖（含中缝和呼吸孔）→ 握位 → 笔杆（酒红渐变 + 高光）→ 笔顶圆珠
    -->
    <g id="pen" opacity="0">
      <g id="penInner">
        <defs>
          <linearGradient id="barrelGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8e2f23"/>
            <stop offset="0.45" stop-color="#c0392b"/>
            <stop offset="1" stop-color="#6e241b"/>
          </linearGradient>
          <linearGradient id="nibGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#c9a227"/>
            <stop offset="0.5" stop-color="#f4d03f"/>
            <stop offset="1" stop-color="#b8912a"/>
          </linearGradient>
        </defs>
        <!-- 笔杆 -->
        <rect x="-4" y="-46" width="8" height="26" rx="3.5" fill="url(#barrelGrad)"/>
        <rect x="-2.6" y="-44" width="1.6" height="22" rx="0.8" fill="#e8b0a5" opacity="0.55"/>
        <!-- 笔顶装饰环 + 圆珠 -->
        <rect x="-4.4" y="-49" width="8.8" height="3.4" rx="1.7" fill="#d4ac0d"/>
        <circle cx="0" cy="-51.5" r="2.6" fill="#7b241c"/>
        <!-- 握位 -->
        <path d="M -3.4 -20 L 3.4 -20 L 2.6 -13 L -2.6 -13 Z" fill="#2c3e50"/>
        <!-- 笔尖（铱金粒 → 尖） -->
        <path d="M -2.6 -13 L 2.6 -13 L 1.1 -2 L 0 0 L -1.1 -2 Z" fill="url(#nibGrad)"/>
        <line x1="0" y1="-12" x2="0" y2="-1.6" stroke="#7d6608" stroke-width="0.7"/>
        <circle cx="0" cy="-8.5" r="0.9" fill="#7d6608"/>
      </g>
    </g>
  </svg>
  <div class="toast"><span class="board" id="boardName"></span><span class="label" id="curLabel">…</span><span id="progress">0</span></div>
  <div class="controls">
    <select id="boardSelect" onchange="switchBoard(this.value)"></select>
    <button onclick="resetView()" id="btnFit">适应</button>
    <button onclick="location.reload()" id="btnRefresh">刷新</button>
    <button onclick="clearCanvas()" id="btnClear">清空</button>
    <span style="color:#a89d85" id="hint">滚轮缩放 · 拖拽平移 · 实时连接</span>
  </div>
</div>
<script>
// ---------- i18n（由服务器注入；直接打开文件时用兜底中文） ----------
const I18N = {
  title: "✏️ 实时画布", waiting: "等待 AI 动笔…", strokeUnit: " 笔", batchDone: "✅ 本批完成",
  cleared: "画布已清空", restored: "已恢复画布，等待 AI 动笔…", disconnected: "连接断开，重连中…",
  removedEl: "🗑️ 已删除元素 {id}", fit: "适应", refresh: "刷新", clear: "清空",
  hint: "滚轮缩放 · 拖拽平移 · 实时连接", board: "画板",
};
function tr(key, vars) {
  let s = I18N[key] ?? key;
  if (vars) for (const k of Object.keys(vars)) s = s.replaceAll("{" + k + "}", String(vars[k]));
  return s;
}
document.title = tr("title");
document.getElementById("btnFit").textContent = tr("fit");
document.getElementById("btnRefresh").textContent = tr("refresh");
document.getElementById("btnClear").textContent = tr("clear");
document.getElementById("hint").textContent = tr("hint");

// ---------- 画板 ----------
let board = new URLSearchParams(location.search).get("board") || "";
const boardNameEl = document.getElementById("boardName");
const boardSelect = document.getElementById("boardSelect");
async function initBoard() {
  try {
    const res = await fetch("/api/boards");
    const data = await res.json();
    if (!board) board = data.active || "default";
    boardSelect.innerHTML = "";
    for (const b of data.boards ?? []) {
      const opt = document.createElement("option");
      opt.value = b.name;
      opt.textContent = b.name;
      if (b.name === board) opt.selected = true;
      boardSelect.appendChild(opt);
    }
  } catch { if (!board) board = "default"; }
  boardNameEl.textContent = tr("board") + " · " + board;
  connect();
}
function switchBoard(name) {
  if (name && name !== board) location.search = "?board=" + encodeURIComponent(name);
}

// ---------- 无限画布 ----------
const svg = document.getElementById("canvas");
const content = document.getElementById("content");
const pen = document.getElementById("pen");
const penInner = document.getElementById("penInner");
const labelEl = document.getElementById("curLabel");
const progEl = document.getElementById("progress");
let vb = { x: 0, y: 0, w: 800, h: 500 };
function applyView() { svg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h); }
function resetView() {
  const r = svg.getBoundingClientRect();
  const W = vb.w, H = vb.h;
  const ratio = r.width / r.height;
  let w = W, h = H;
  if (W / H > ratio) { h = H; w = H * ratio; } else { w = W; h = W / ratio; }
  vb = { x: (W - w) / 2, y: (H - h) / 2, w, h };
  applyView();
}
let drag = null;
svg.addEventListener("mousedown", (e) => { drag = { sx: e.clientX, sy: e.clientY, vx: vb.x, vy: vb.y }; svg.style.cursor = "grabbing"; });
window.addEventListener("mousemove", (e) => {
  if (!drag) return;
  const r = svg.getBoundingClientRect();
  vb.x = drag.vx - ((e.clientX - drag.sx) * vb.w) / r.width;
  vb.y = drag.vy - ((e.clientY - drag.sy) * vb.h) / r.height;
  applyView();
});
window.addEventListener("mouseup", () => { drag = null; svg.style.cursor = ""; });
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const fx = vb.x + (mx * vb.w) / r.width;
  const fy = vb.y + (my * vb.h) / r.height;
  const f = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  const nw = vb.w * f, nh = vb.h * f;
  if (nw < 50 || nw > 800000) return;
  vb.x = fx - (mx * nw) / r.width;
  vb.y = fy - (my * nh) / r.height;
  vb.w = nw; vb.h = nh;
  applyView();
}, { passive: false });
applyView();

// ---------- z-order：每个元素一个 <g>，按 z 排序插入 ----------
function elGroup(elementId, z) {
  const id = elementId || "";
  let g = content.querySelector(`g.el[data-element-id="${id}"]`);
  if (g) return g;
  g = svgNS("g");
  g.setAttribute("class", "el");
  g.setAttribute("data-element-id", id);
  g.dataset.z = z == null ? "" : String(z);
  const zz = z == null ? Infinity : z;
  for (const other of content.querySelectorAll("g.el")) {
    const oz = other.dataset.z === "" ? Infinity : Number(other.dataset.z);
    if (oz > zz) { content.insertBefore(g, other); return g; }
  }
  content.appendChild(g);
  return g;
}

// ---------- 笔画播放 + 钢笔跟随 ----------
let totalStrokes = 0;
let queue = Promise.resolve();
let wipeSeq = 0;

/** 固定握笔倾角：真实书写时笔的角度基本不变，随路径切线旋转会剧烈抖动 */
const PEN_ANGLE = -30;
/** 笔尖当前位置（画布坐标），用于笔画间的抬笔滑行 */
let penPos = null;

function movePen(x, y) {
  penPos = { x, y };
  penInner.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${PEN_ANGLE})`);
}
function showPen() { pen.setAttribute("opacity", "1"); }
function hidePen() { pen.setAttribute("opacity", "0"); }

/** 抬笔滑行：从当前位置平滑移到下一笔起点（easeOutCubic，按距离定时长） */
function glidePen(to) {
  const from = penPos;
  if (!from) { movePen(to.x, to.y); return Promise.resolve(); }
  const dist = Math.hypot(to.x - from.x, to.y - from.y);
  if (dist < 24) { movePen(to.x, to.y); return Promise.resolve(); }
  const dur = Math.min(280, 70 + dist * 0.3);
  showPen();
  const startT = performance.now();
  return new Promise((resolve) => {
    function frame(now) {
      const t = Math.min(1, (now - startT) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      movePen(from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e);
      if (t < 1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}

function svgNS(tag) { return document.createElementNS("http://www.w3.org/2000/svg", tag); }

/** 播放单个笔画（写出来 + 钢笔跟随） */
async function playStroke(s) {
  const dur = Math.max(80, s.dur || 300);
  const group = elGroup(s.elementId, s.z);
  // 字体文字（拉丁/符号）：擦除式显出——从左到右揭开，笔尖跟着写出前沿走，
  // 保留原字体的美观，又不像淡入那样"跳出来"
  if (s.isText) {
    const g = svgNS("g");
    g.innerHTML = s.d;
    group.appendChild(g);
    const bb = g.getBBox();
    const pad = Math.max(2, bb.height * 0.1);
    const clipId = `wipe${++wipeSeq}`;
    const clip = svgNS("clipPath");
    clip.setAttribute("id", clipId);
    const rect = svgNS("rect");
    rect.setAttribute("x", bb.x - pad);
    rect.setAttribute("y", bb.y - pad);
    rect.setAttribute("width", "0");
    rect.setAttribute("height", bb.height + pad * 2);
    clip.appendChild(rect);
    group.appendChild(clip);
    g.setAttribute("clip-path", `url(#${clipId})`);

    const wipeDur = Math.max(200, dur);
    const startX = bb.x - pad;
    const full = bb.width + pad * 2;
    const penY = bb.y + bb.height * 0.72; // 笔尖贴在基线附近
    await glidePen({ x: startX, y: penY });
    showPen();
    const startT = performance.now();
    return new Promise((resolve) => {
      function frame(now) {
        const t = Math.min(1, (now - startT) / wipeDur);
        rect.setAttribute("width", String(full * t));
        movePen(startX + full * t, penY);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          g.removeAttribute("clip-path"); // 显完去掉裁剪，不留残留节点
          clip.remove();
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }
  const p = svgNS("path");
  p.setAttribute("d", s.d);
  p.setAttribute("stroke-linecap", "round");
  p.setAttribute("stroke-linejoin", "round");
  if (s.hatch) {
    // 填充斜线：所有线合并为一条 path，整体快速生长，笔尖不跟随
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", s.color);
    p.setAttribute("stroke-width", s.width);
    group.appendChild(p);
    const hlen = p.getTotalLength();
    p.style.strokeDasharray = hlen;
    p.style.strokeDashoffset = hlen;
    p.style.transition = `stroke-dashoffset ${dur}ms ease-out`;
    hidePen();
    requestAnimationFrame(() => { p.style.strokeDashoffset = "0"; });
    return new Promise(r => setTimeout(r, dur));
  }
  if (s.fill) {
    // 填充图形（箭头尖）：淡入
    p.setAttribute("fill", s.fill);
    p.setAttribute("stroke", "none");
    p.style.opacity = "0";
    p.style.transition = `opacity ${dur}ms`;
    group.appendChild(p);
    requestAnimationFrame(() => { p.style.opacity = "1"; });
    hidePen();
    return new Promise(r => setTimeout(r, dur));
  }
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", s.color);
  p.setAttribute("stroke-width", s.width);
  group.appendChild(p);

  const len = p.getTotalLength();
  // dash 生长动画
  p.style.strokeDasharray = len;
  p.style.strokeDashoffset = len;
  p.style.transition = `stroke-dashoffset ${dur}ms linear`;

  // 先抬笔滑行到本笔起点，再落笔书写
  await glidePen(p.getPointAtLength(0));
  showPen();

  const startT = performance.now();
  return new Promise((resolve) => {
    function frame(now) {
      const t = Math.min(1, (now - startT) / dur);
      const pt = p.getPointAtLength(len * t);
      movePen(pt.x, pt.y);
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        p.style.strokeDashoffset = 0;
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

/** 静态落笔（无动画）：用于刷新/重连后的历史回放 */
function drawStrokeInstant(s) {
  totalStrokes++;
  const group = elGroup(s.elementId, s.z);
  if (s.isText) {
    const g = svgNS("g");
    g.innerHTML = s.d;
    group.appendChild(g);
    return;
  }
  const p = svgNS("path");
  p.setAttribute("d", s.d);
  p.setAttribute("stroke-linecap", "round");
  p.setAttribute("stroke-linejoin", "round");
  if (s.fill) {
    p.setAttribute("fill", s.fill);
    p.setAttribute("stroke", "none");
  } else {
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", s.color);
    p.setAttribute("stroke-width", s.width);
  }
  group.appendChild(p);
}

function renderInstant(strokes) {
  // 重连时服务器会重放全量历史，先清空避免重复叠加
  content.innerHTML = "";
  totalStrokes = 0;
  for (const s of strokes) drawStrokeInstant(s);
  progEl.textContent = totalStrokes + tr("strokeUnit");
  hidePen();
  penPos = null;
}

/** 处理一批笔画（顺序播放） */
function handleStrokes(strokes) {
  queue = queue.then(async () => {
    for (const s of strokes) {
      totalStrokes++;
      progEl.textContent = totalStrokes + tr("strokeUnit");
      labelEl.textContent = "✏️ " + (s.label || "绘制");
      await playStroke(s);
    }
    labelEl.textContent = tr("batchDone");
  });
}

function clearCanvas() {
  content.innerHTML = "";
  totalStrokes = 0;
  penPos = null;
  hidePen();
  progEl.textContent = "0" + tr("strokeUnit");
  labelEl.textContent = tr("cleared");
}

// ---------- WebSocket 实时接收 ----------
let ws = null;
/** 连接后收到的第一批 = 服务器回放的历史内容，直接静态渲染，不重新播放动画 */
let expectReplay = true;
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?board=${encodeURIComponent(board)}`);
  window.__wsState = "connecting";
  ws.onopen = () => { window.__wsState = "open"; labelEl.textContent = tr("waiting"); };
  ws.onmessage = (ev) => {
    window.__msgCount = (window.__msgCount || 0) + 1;
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "clear") { expectReplay = false; clearCanvas(); return; }
      if (msg.type === "remove") {
        expectReplay = false;
        content.querySelectorAll(`g.el[data-element-id="${msg.elementId}"]`).forEach((el) => el.remove());
        labelEl.textContent = tr("removedEl", { id: msg.elementId });
        return;
      }
      if (msg.type === "update") {
        expectReplay = false;
        content.querySelectorAll(`g.el[data-element-id="${msg.elementId}"]`).forEach((el) => el.remove());
        handleStrokes(msg.strokes.map((s) => ({ ...s, elementId: msg.elementId, z: msg.z ?? s.z })));
        return;
      }
      if (msg.type === "batch") {
        if (expectReplay) { expectReplay = false; renderInstant(msg.strokes); labelEl.textContent = tr("restored"); return; }
        handleStrokes(msg.strokes);
        return;
      }
      if (msg.type === "stroke") { expectReplay = false; handleStrokes([msg]); return; }
    } catch (e) {
      window.__lastErr = e.message;
    }
  };
  ws.onclose = () => {
    window.__wsState = "closed";
    expectReplay = true; // 重连后服务器会再次回放全量历史
    labelEl.textContent = tr("disconnected");
    setTimeout(connect, 1500);
  };
  ws.onerror = () => { window.__wsState = "error"; ws.close(); };
}
initBoard();
</script>
</body>
</html>
