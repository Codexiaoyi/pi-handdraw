<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>✏️ 实时画布</title>
<style>
  :root {
    --bg: #f6f7f9;
    --grid-dot: #dde0e7;
    --island: rgba(255, 255, 255, 0.86);
    --border: rgba(16, 24, 40, 0.08);
    --ink: #171b21;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: rgba(79, 70, 229, 0.1);
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 8px 24px rgba(16, 24, 40, 0.1);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 画布底色：冷调中性 + 圆点网格，无限画布的现代语言 */
  .stage {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: var(--bg);
    background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1.2px);
    background-size: 22px 22px;
    background-position: center;
  }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  /* 悬浮玻璃岛：顶栏状态条与底栏工具条共用 */
  .hud {
    position: fixed; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: var(--island);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    z-index: 10; user-select: none;
    font-size: 13px; color: var(--ink);
    transition: opacity 0.35s ease;
  }
  /* 作画时底栏淡出，不挡笔画；悬停随时恢复 */
  .hud.dim { opacity: 0.25; }
  .hud:hover { opacity: 1; }
  .toast { top: 16px; padding: 8px 14px; }
  .toast .label { color: var(--ink); font-weight: 500; letter-spacing: 0.01em; }
  .toast .board {
    background: var(--accent-soft); color: var(--accent);
    font-weight: 600; font-size: 12px;
    padding: 3px 8px; border-radius: 6px;
  }
  .toast .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  /* WebSocket 实时状态呼吸灯 */
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; flex: none; transition: background 0.3s; }
  .dot.on { background: #22c55e; animation: pulse 2.2s ease-in-out infinite; }
  .dot.off { background: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18); }
    50% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.05); }
  }
  @media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
  /* ---------- Agent 工作呼吸灯（抄自 AIPex） ---------- */
  /* AIPex Thinking.tsx：三个蓝色小点交错脉冲（animate-pulse 1.4s，延迟 0/200/400ms） */
  .agent-pulse { display: inline-flex; align-items: center; gap: 4px; }
  .agent-pulse i {
    width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; /* blue-500 */
    animation: agentPulse 1.4s cubic-bezier(.4, 0, .6, 1) infinite;
  }
  .agent-pulse i:nth-child(2) { animation-delay: 200ms; }
  .agent-pulse i:nth-child(3) { animation-delay: 400ms; }
  @keyframes agentPulse { 50% { opacity: .5; } } /* tailwind animate-pulse 原样 */
  .agent-label { color: #2563eb; font-weight: 500; }
  /* aipex-company breathing-border-overlay.tsx 原样照搬：4 层递进蓝色 inset 光晕呼吸 */
  #breath {
    position: fixed; inset: 0; pointer-events: none; z-index: 9;
    opacity: 0; transition: opacity 0.5s ease-in-out;
  }
  body.agent-working #breath { opacity: 1; animation: breatheInwardGlow 2.5s ease-in-out infinite; }
  @keyframes breatheInwardGlow {
    0%, 100% {
      box-shadow:
        inset 0 0 12px 3px rgba(37, 99, 235, 0.35),
        inset 0 0 20px 5px rgba(59, 130, 246, 0.28),
        inset 0 0 28px 6px rgba(96, 165, 250, 0.22),
        inset 0 0 35px 8px rgba(147, 197, 253, 0.15);
    }
    50% {
      box-shadow:
        inset 0 0 20px 5px rgba(37, 99, 235, 0.7),
        inset 0 0 30px 7px rgba(59, 130, 246, 0.6),
        inset 0 0 40px 9px rgba(96, 165, 250, 0.5),
        inset 0 0 50px 11px rgba(147, 197, 253, 0.35);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .agent-pulse i, body.agent-working #breath { animation: none; }
  }
  .controls { bottom: 18px; padding: 6px; gap: 4px; }
  /* 幽灵按钮：透明底，hover 才浮现 */
  button, select {
    border: 1px solid transparent; background: transparent; color: var(--ink);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; font-family: inherit;
    cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
  }
  button:hover, select:hover { background: rgba(16, 24, 40, 0.06); }
  button:active { background: rgba(16, 24, 40, 0.1); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #btnClear:hover { color: var(--danger); background: rgba(220, 38, 38, 0.08); }
  select { border-color: var(--border); background: #fff; }
  #hint {
    color: var(--muted); font-size: 12px;
    border-left: 1px solid var(--border);
    padding-left: 10px; margin-left: 4px;
  }
  [hidden] { display: none !important; }
  /* ---------- 新建画板弹层 ---------- */
  .nb-pop {
    position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 8px;
    background: var(--island);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); z-index: 12;
  }
  .nb-pop input {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font: inherit; font-size: 13px;
    background: #fff; width: 170px;
  }
  .nb-pop input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nb-pop .ok { background: var(--accent); color: #fff; }
  .nb-pop .ok:hover { background: #4338ca; }
  /* ---------- Web Agent 聊天面板（左侧悬浮卡片，可推拉） ---------- */
  .chat-launcher {
    position: fixed; left: 16px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--island);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid var(--border);
    box-shadow: var(--shadow); font-size: 18px; z-index: 11;
  }
  .chat-launcher:hover { background: #fff; }
  .chat-launcher svg { width: 20px; height: 20px; }
  .icon { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .chat-title svg { width: 15px; height: 15px; color: var(--accent); }
  .chat-panel {
    position: fixed; left: 16px; top: 72px; bottom: 86px;
    width: 340px; max-width: calc(100vw - 80px);
    display: flex; flex-direction: column;
    background: var(--island);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 2px 4px rgba(16, 24, 40, 0.05), 0 16px 48px rgba(16, 24, 40, 0.16);
    z-index: 11; overflow: hidden;
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .chat-panel.closed { transform: translateX(calc(-100% - 32px)); }
  .chat-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 12px 10px; border-bottom: 1px solid var(--border);
  }
  .chat-title { font-weight: 600; font-size: 13px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  .chat-model {
    margin-left: auto; font-size: 11px; color: var(--muted);
    background: rgba(16, 24, 40, 0.05); padding: 2px 8px; border-radius: 6px;
    max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chat-head button { padding: 2px 8px; font-size: 13px; }
  .chat-msgs {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg {
    max-width: 85%; padding: 8px 12px; border-radius: 12px;
    font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: rgba(16, 24, 40, 0.05); color: var(--ink); border-bottom-left-radius: 4px; }
  .msg.thinking { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  .msg.thinking i { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; animation: blink 1.2s infinite; }
  .msg.thinking i:nth-child(2) { animation-delay: 0.2s; }
  .msg.thinking i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
  .chat-input { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
  .chat-input textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; font: inherit; font-size: 13px; background: #fff;
    min-height: 36px; max-height: 96px; line-height: 1.4;
  }
  .chat-input textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chat-input button { background: var(--accent); color: #fff; border-radius: 10px; padding: 0 14px; }
  .chat-input button:hover { background: #4338ca; }
  .chat-input button:disabled { opacity: 0.5; cursor: default; }
  /* ---------- 元素选中：蚂蚁线高亮框 + 操作条 ---------- */
  .sel-rect {
    fill: rgba(79, 70, 229, 0.07); stroke: var(--accent);
    stroke-width: 1.5; stroke-dasharray: 6 4;
    animation: march 0.8s linear infinite;
  }
  @keyframes march { to { stroke-dashoffset: -10; } }
  @media (prefers-reduced-motion: reduce) { .sel-rect { animation: none; } }
  /* ---------- 选中高亮：外圈苗边 + 柔光呼吸（不作用于原对象本身） ---------- */
  .sel-ring {
    fill: none;
    stroke: #6c8cff;
    stroke-width: 2;
    rx: 8;
    pointer-events: none;
    animation: ringBreathe 1.8s ease-in-out infinite;
  }
  @keyframes ringBreathe {
    0%, 100% {
      stroke-width: 1.6;
      stroke-opacity: 0.7;
      filter: drop-shadow(0 0 2px rgba(108, 140, 255, 0.35));
    }
    50% {
      stroke-width: 3;
      stroke-opacity: 1;
      filter: drop-shadow(0 0 6px rgba(108, 140, 255, 0.65));
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .sel-ring { animation: none; }
  }
  /* ---------- 双击说明浮窗 ---------- */
  .desc-pop {
    position: fixed;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid rgba(108, 140, 255, 0.35);
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: 0 8px 28px rgba(108, 140, 255, 0.25), 0 2px 6px rgba(16, 24, 40, 0.08);
    z-index: 20;
    max-width: 280px;
    font-size: 13px;
    line-height: 1.5;
    color: #171b21;
    animation: popIn 0.18s ease-out;
  }
  .desc-pop .desc-title {
    font-size: 11px;
    color: #6c8cff;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .desc-pop .desc-body { color: #171b21; }
  .desc-pop .desc-order {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(108, 140, 255, 0.25);
    font-size: 11px;
    color: #6b7280;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(-4px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .sel-chip { top: 16px; left: 16px; transform: none; padding: 6px 8px 6px 12px; gap: 6px; }
  .sel-chip .sel-label {
    font-size: 12px; color: var(--ink); max-width: 240px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sel-chip .sel-id { color: var(--muted); }
  #selDelete:hover { color: var(--danger); background: rgba(220, 38, 38, 0.08); }
  /* 钢笔指示器（变换由 JS 每帧写入，禁掉 CSS 过渡避免滞后抖动；仅透明度用过渡做淡出） */
  #pen { pointer-events: none; filter: drop-shadow(1px 2px 2px rgba(60,40,20,0.35)); transition: opacity 0.45s ease; }
</style>
</head>
<body>
<div class="stage">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <g id="content"></g>
    <g id="overlay" pointer-events="none"></g>
    <!--
      钢笔：笔尖在 (0,0)，笔身沿 -y 方向；JS 里 translate 到笔画点 + 固定倾角。
      结构：金色笔尖（含中缝和呼吸孔）→ 握位 → 笔杆（酒红渐变 + 高光）→ 笔顶圆珠
    -->
    <g id="pen" opacity="0">
      <g id="penInner">
        <defs>
          <linearGradient id="barrelGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8e2f23"/>
            <stop offset="0.45" stop-color="#c0392b"/>
            <stop offset="1" stop-color="#6e241b"/>
          </linearGradient>
          <linearGradient id="nibGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#c9a227"/>
            <stop offset="0.5" stop-color="#f4d03f"/>
            <stop offset="1" stop-color="#b8912a"/>
          </linearGradient>
        </defs>
        <!-- 笔杆 -->
        <rect x="-4" y="-46" width="8" height="26" rx="3.5" fill="url(#barrelGrad)"/>
        <rect x="-2.6" y="-44" width="1.6" height="22" rx="0.8" fill="#e8b0a5" opacity="0.55"/>
        <!-- 笔顶装饰环 + 圆珠 -->
        <rect x="-4.4" y="-49" width="8.8" height="3.4" rx="1.7" fill="#d4ac0d"/>
        <circle cx="0" cy="-51.5" r="2.6" fill="#7b241c"/>
        <!-- 握位 -->
        <path d="M -3.4 -20 L 3.4 -20 L 2.6 -13 L -2.6 -13 Z" fill="#2c3e50"/>
        <!-- 笔尖（铱金粒 → 尖） -->
        <path d="M -2.6 -13 L 2.6 -13 L 1.1 -2 L 0 0 L -1.1 -2 Z" fill="url(#nibGrad)"/>
        <line x1="0" y1="-12" x2="0" y2="-1.6" stroke="#7d6608" stroke-width="0.7"/>
        <circle cx="0" cy="-8.5" r="0.9" fill="#7d6608"/>
      </g>
    </g>
  </svg>
  <div class="toast hud"><span class="dot" id="wsDot"></span><span class="board" id="boardName"></span><span class="agent-pulse" id="agentPulse" hidden><i></i><i></i><i></i><span class="agent-label">AI 思考 / 作画中…</span></span><span class="label" id="curLabel">…</span><span class="progress" id="progress">0</span></div>
  <div id="breath"></div>
  <div class="controls hud">
    <select id="boardSelect" onchange="switchBoard(this.value)"></select>
    <button onclick="toggleNbPop()" id="btnNewBoard" title="新建画板">＋</button>
    <button onclick="resetView()" id="btnFit">适应</button>
    <button onclick="location.reload()" id="btnRefresh">刷新</button>
    <button onclick="clearCanvas()" id="btnClear">清空</button>
    <span id="hint">滚轮缩放 · 拖拽平移 · 实时连接</span>
  </div>
  <div class="nb-pop" id="nbPop" hidden>
    <input id="nbName" placeholder="新画板名" maxlength="60">
    <button class="ok" onclick="createBoardFromPop()" id="nbOk">创建</button>
  </div>
  <div class="sel-chip hud" id="selChip" hidden>
    <span class="sel-label" id="selLabel"></span>
    <button id="selQuote">引用</button>
    <button id="selDelete">删除</button>
    <button id="selClose">✕</button>
  </div>
  <button class="chat-launcher" id="chatLauncher" title="聊天" hidden><svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
  <div class="chat-panel closed" id="chatPanel" hidden>
    <div class="chat-head">
      <span class="chat-title"><svg class="icon" viewBox="0 0 24 24"><path d="M15.7 21.3a1 1 0 0 1-1.4 0l-1.6-1.6a1 1 0 0 1 0-1.4l5.6-5.6a1 1 0 0 1 1.4 0l1.6 1.6a1 1 0 0 1 0 1.4z"/><path d="m18 13-1.4-6.9a1 1 0 0 0-.7-.8L3.2 2a1 1 0 0 0-1.2 1.2l3.3 12.7a1 1 0 0 0 .8.7L13 18"/><path d="m2.3 2.3 7.3 7.3"/><circle cx="11" cy="11" r="2"/></svg><span>画布小助手</span></span>
      <span class="chat-model" id="chatModel"></span>
      <button id="chatClose" title="收起">«</button>
    </div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input">
      <textarea id="chatText" rows="1" placeholder="让 AI 画点什么…"></textarea>
      <button id="chatSend">发送</button>
    </div>
  </div>
</div>
<script>
// ---------- i18n（由服务器注入；直接打开文件时用兜底中文） ----------
const I18N = {
  title: "✏️ 实时画布", waiting: "等待 AI 动笔…", strokeUnit: " 笔", batchDone: "✅ 本批完成",
  cleared: "画布已清空", restored: "已恢复画布，等待 AI 动笔…", disconnected: "连接断开，重连中…",
  removedEl: "🗑️ 已删除元素 {id}", fit: "适应", refresh: "刷新", clear: "清空",
  hint: "滚轮缩放 · 拖拽平移 · 实时连接", board: "画板",
  newBoard: "新建画板", nbPh: "新画板名", create: "创建",
  chatPh: "让 AI 画点什么…", send: "发送",
  noCfg: "未配置模型 API Key：请设置 HANDDRAW_LLM_API_KEY 后重启 agent。",
  netErr: "⚠️ 网络错误，请稍后再试",
};
function tr(key, vars) {
  let s = I18N[key] ?? key;
  if (vars) for (const k of Object.keys(vars)) s = s.replaceAll("{" + k + "}", String(vars[k]));
  return s;
}
document.title = tr("title");
document.getElementById("btnFit").textContent = tr("fit");
document.getElementById("btnRefresh").textContent = tr("refresh");
document.getElementById("btnClear").textContent = tr("clear");
document.getElementById("hint").textContent = tr("hint");
document.getElementById("btnNewBoard").title = tr("newBoard");
document.getElementById("nbName").placeholder = tr("nbPh");
document.getElementById("nbOk").textContent = tr("create");
document.getElementById("chatText").placeholder = tr("chatPh");
document.getElementById("chatSend").textContent = tr("send");

// ---------- 画板 ----------
let board = new URLSearchParams(location.search).get("board") || "";
const boardNameEl = document.getElementById("boardName");
const boardSelect = document.getElementById("boardSelect");
async function initBoard() {
  try {
    const res = await fetch("/api/boards");
    const data = await res.json();
    if (!board) board = data.active || "default";
    boardSelect.innerHTML = "";
    for (const b of data.boards ?? []) {
      const opt = document.createElement("option");
      opt.value = b.name;
      opt.textContent = b.name;
      if (b.name === board) opt.selected = true;
      boardSelect.appendChild(opt);
    }
  } catch { if (!board) board = "default"; }
  boardNameEl.textContent = tr("board") + " · " + board;
  restoreView(); // 恢复该画板上次的视角
  connect();
}
function switchBoard(name) {
  if (name && name !== board) location.search = "?board=" + encodeURIComponent(name);
}

// ---------- 无限画布 ----------
const svg = document.getElementById("canvas");
const content = document.getElementById("content");
const pen = document.getElementById("pen");
const penInner = document.getElementById("penInner");
const labelEl = document.getElementById("curLabel");
const progEl = document.getElementById("progress");
const wsDot = document.getElementById("wsDot");
const controlsEl = document.querySelector(".controls");
let vb = { x: 0, y: 0, w: 800, h: 500 };
function applyView() { svg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h); }

// ---------- 视角保存：每个画板记住上次的 viewBox，刷新/重进后恢复 ----------
function viewKey() { return "handdraw-view:" + board; }
let viewSaveTimer = null;
function scheduleSaveView() {
  clearTimeout(viewSaveTimer);
  viewSaveTimer = setTimeout(() => {
    try { localStorage.setItem(viewKey(), JSON.stringify(vb)); } catch { /* ignore */ }
  }, 250);
}
function restoreView() {
  try {
    const raw = localStorage.getItem(viewKey());
    if (!raw) return;
    const v = JSON.parse(raw);
    if ([v.x, v.y, v.w, v.h].every((n) => Number.isFinite(n)) && v.w >= 50 && v.w <= 800000 && v.h > 0) {
      vb = v;
      applyView();
    }
  } catch { /* ignore */ }
}
function resetView() {
  const r = svg.getBoundingClientRect();
  const W = vb.w, H = vb.h;
  const ratio = r.width / r.height;
  let w = W, h = H;
  if (W / H > ratio) { h = H; w = H * ratio; } else { w = W; h = W / ratio; }
  vb = { x: (W - w) / 2, y: (H - h) / 2, w, h };
  applyView();
}
let drag = null;
svg.addEventListener("mousedown", (e) => { drag = { sx: e.clientX, sy: e.clientY, vx: vb.x, vy: vb.y }; svg.style.cursor = "grabbing"; });
// 双击元素 → 弹出说明浮窗
svg.addEventListener("dblclick", (e) => {
  let g = e.target && e.target.closest ? e.target.closest("g.el") : null;
  if (!g || !content.contains(g)) g = pickElementAt(e.clientX, e.clientY);
  if (!g) return;
  selectElement(g); // 双击先选中
  showDescPop(e.clientX, e.clientY);
});
window.addEventListener("mousemove", (e) => {
  if (!drag) return;
  const r = svg.getBoundingClientRect();
  vb.x = drag.vx - ((e.clientX - drag.sx) * vb.w) / r.width;
  vb.y = drag.vy - ((e.clientY - drag.sy) * vb.h) / r.height;
  applyView();
  scheduleSaveView();
});
window.addEventListener("mouseup", (e) => {
  if (drag) {
    // 位移小于阈值视为点击：点中元素分组 → 选中高亮；点空白 → 取消选中
    const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
    if (moved <= 4) {
      let g = e.target && e.target.closest ? e.target.closest("g.el") : null;
      if (!g || !content.contains(g)) g = pickElementAt(e.clientX, e.clientY); // 空心图形内部的包围盒兜底
      if (g) selectElement(g);
      else if (e.target === svg || content.contains(e.target)) deselect();
    }
  }
  drag = null; svg.style.cursor = "";
});

/** 兜底命中：屏幕点 → SVG 坐标，取最上层（DOM 末尾）包围盒包含该点的元素 */
function pickElementAt(clientX, clientY) {
  const ctm = svg.getScreenCTM();
  if (!ctm) return null;
  const pt = new DOMPoint(clientX, clientY).matrixTransform(ctm.inverse());
  const groups = content.querySelectorAll("g.el");
  const pad = 6;
  for (let i = groups.length - 1; i >= 0; i--) {
    try {
      const bb = groups[i].getBBox();
      if (pt.x >= bb.x - pad && pt.x <= bb.x + bb.width + pad && pt.y >= bb.y - pad && pt.y <= bb.y + bb.height + pad) {
        return groups[i];
      }
    } catch { /* 空分组 */ }
  }
  return null;
}
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const fx = vb.x + (mx * vb.w) / r.width;
  const fy = vb.y + (my * vb.h) / r.height;
  const f = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  const nw = vb.w * f, nh = vb.h * f;
  if (nw < 50 || nw > 800000) return;
  vb.x = fx - (mx * nw) / r.width;
  vb.y = fy - (my * nh) / r.height;
  vb.w = nw; vb.h = nh;
  applyView();
  scheduleSaveView();
}, { passive: false });
applyView();

// ---------- z-order：每个元素一个 <g>，按 z 排序插入 ----------
function elGroup(elementId, z, root = content) {
  const id = elementId || "";
  let g = root.querySelector(`g.el[data-element-id="${id}"]`);
  if (g) return g;
  g = svgNS("g");
  g.setAttribute("class", "el");
  g.setAttribute("data-element-id", id);
  g.dataset.z = z == null ? "" : String(z);
  const zz = z == null ? Infinity : z;
  for (const other of root.querySelectorAll("g.el")) {
    const oz = other.dataset.z === "" ? Infinity : Number(other.dataset.z);
    if (oz > zz) { root.insertBefore(g, other); return g; }
  }
  root.appendChild(g);
  return g;
}

// ---------- 笔画播放 + 钢笔跟随 ----------
let totalStrokes = 0;
let queue = Promise.resolve();
let wipeSeq = 0;

/** 固定握笔倾角：真实书写时笔的角度基本不变，随路径切线旋转会剧烈抖动。右倾 30° */
const PEN_ANGLE = 30;
/** 笔尖当前位置（画布坐标），用于笔画间的抬笔滑行 */
let penPos = null;

function movePen(x, y) {
  penPos = { x, y };
  penInner.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${PEN_ANGLE})`);
}
function showPen() { pen.setAttribute("opacity", "1"); }
function hidePen() { pen.setAttribute("opacity", "0"); }

/** 抬笔滑行：从当前位置平滑移到下一笔起点（easeOutCubic，按距离定时长） */
function glidePen(to) {
  const from = penPos;
  if (!from) { movePen(to.x, to.y); return Promise.resolve(); }
  const dist = Math.hypot(to.x - from.x, to.y - from.y);
  if (dist < 24) { movePen(to.x, to.y); return Promise.resolve(); }
  const dur = Math.min(280, 70 + dist * 0.3);
  showPen();
  const startT = performance.now();
  return new Promise((resolve) => {
    function frame(now) {
      const t = Math.min(1, (now - startT) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      movePen(from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e);
      if (t < 1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}

function svgNS(tag) { return document.createElementNS("http://www.w3.org/2000/svg", tag); }

/** 播放单个笔画（写出来 + 钢笔跟随） */
async function playStroke(s) {
  const dur = Math.max(80, s.dur || 300);
  const group = elGroup(s.elementId, s.z);
  // 字体文字（拉丁/符号）：擦除式显出——从左到右揭开，笔尖跟着写出前沿走，
  // 保留原字体的美观，又不像淡入那样"跳出来"
  if (s.isText) {
    const g = svgNS("g");
    g.innerHTML = s.d;
    group.appendChild(g);
    const bb = g.getBBox();
    const pad = Math.max(2, bb.height * 0.1);
    const clipId = `wipe${++wipeSeq}`;
    const clip = svgNS("clipPath");
    clip.setAttribute("id", clipId);
    const rect = svgNS("rect");
    rect.setAttribute("x", bb.x - pad);
    rect.setAttribute("y", bb.y - pad);
    rect.setAttribute("width", "0");
    rect.setAttribute("height", bb.height + pad * 2);
    clip.appendChild(rect);
    group.appendChild(clip);
    g.setAttribute("clip-path", `url(#${clipId})`);

    const wipeDur = Math.max(200, dur);
    const startX = bb.x - pad;
    const full = bb.width + pad * 2;
    const penY = bb.y + bb.height * 0.72; // 笔尖贴在基线附近
    await glidePen({ x: startX, y: penY });
    showPen();
    const startT = performance.now();
    return new Promise((resolve) => {
      function frame(now) {
        const t = Math.min(1, (now - startT) / wipeDur);
        rect.setAttribute("width", String(full * t));
        movePen(startX + full * t, penY);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          g.removeAttribute("clip-path"); // 显完去掉裁剪，不留残留节点
          clip.remove();
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }
  const p = svgNS("path");
  p.setAttribute("d", s.d);
  p.setAttribute("stroke-linecap", "round");
  p.setAttribute("stroke-linejoin", "round");
  if (s.hatch) {
    // 填充斜线：所有线合并为一条 path，整体快速生长，笔尖不跟随
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", s.color);
    p.setAttribute("stroke-width", s.width);
    group.appendChild(p);
    const hlen = p.getTotalLength();
    p.style.strokeDasharray = hlen;
    p.style.strokeDashoffset = hlen;
    p.style.transition = `stroke-dashoffset ${dur}ms ease-out`;
    hidePen();
    requestAnimationFrame(() => { p.style.strokeDashoffset = "0"; });
    return new Promise(r => setTimeout(r, dur));
  }
  if (s.fill) {
    // 填充图形（箭头尖）：淡入
    p.setAttribute("fill", s.fill);
    p.setAttribute("stroke", "none");
    p.style.opacity = "0";
    p.style.transition = `opacity ${dur}ms`;
    group.appendChild(p);
    requestAnimationFrame(() => { p.style.opacity = "1"; });
    hidePen();
    return new Promise(r => setTimeout(r, dur));
  }
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", s.color);
  p.setAttribute("stroke-width", s.width);
  group.appendChild(p);

  const len = p.getTotalLength();
  // dash 生长动画
  p.style.strokeDasharray = len;
  p.style.strokeDashoffset = len;
  p.style.transition = `stroke-dashoffset ${dur}ms linear`;

  // 先抬笔滑行到本笔起点，再落笔书写
  await glidePen(p.getPointAtLength(0));
  showPen();

  const startT = performance.now();
  return new Promise((resolve) => {
    function frame(now) {
      const t = Math.min(1, (now - startT) / dur);
      const pt = p.getPointAtLength(len * t);
      movePen(pt.x, pt.y);
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        p.style.strokeDashoffset = 0;
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

/** 静态落笔（无动画）：用于刷新/重连后的历史回放 */
function drawStrokeInstant(s, root = content) {
  totalStrokes++;
  const group = elGroup(s.elementId, s.z, root);
  if (s.isText) {
    const g = svgNS("g");
    g.innerHTML = s.d;
    group.appendChild(g);
    return;
  }
  const p = svgNS("path");
  p.setAttribute("d", s.d);
  p.setAttribute("stroke-linecap", "round");
  p.setAttribute("stroke-linejoin", "round");
  if (s.fill) {
    p.setAttribute("fill", s.fill);
    p.setAttribute("stroke", "none");
  } else {
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", s.color);
    p.setAttribute("stroke-width", s.width);
  }
  group.appendChild(p);
}

function renderInstant(strokes) {
  // 重连时服务器会重放全量历史，先清空避免重复叠加
  strokeSeq++;
  content.innerHTML = "";
  totalStrokes = 0;
  for (const s of strokes) drawStrokeInstant(s);
  progEl.textContent = totalStrokes + tr("strokeUnit");
  hidePen();
  penPos = null;
}

// ---------- 静默整体刷新：agent 任务结束后重绘全部内容，清掉前端残留 ----------
/** 笔画版本号：fetch 期间若有新笔画到达则放弃本次刷新（下一次 agent 结束还会再刷） */
let strokeSeq = 0;
let refreshQueued = false;
function scheduleSilentRefresh() {
  if (refreshQueued) return;
  refreshQueued = true;
  // 排在笔画播放队列后面：等正在播放的动画画完再刷，用户无感知
  queue = queue.then(() => {
    refreshQueued = false;
    return silentRefresh();
  });
}
async function silentRefresh() {
  try {
    const seq = strokeSeq;
    const res = await fetch("/api/strokes?board=" + encodeURIComponent(board));
    const data = await res.json();
    if (!Array.isArray(data.strokes)) return;
    if (seq !== strokeSeq) return;
    deselect();
    // 先在屏外分组里渲染完，再一次同步替换，避免闪烁
    totalStrokes = 0;
    const tmp = svgNS("g");
    for (const s of data.strokes) drawStrokeInstant(s, tmp);
    content.innerHTML = "";
    while (tmp.firstChild) content.appendChild(tmp.firstChild);
    progEl.textContent = totalStrokes + tr("strokeUnit");
    hidePen();
    penPos = null;
    elMetaCache = null;
  } catch { /* 静默刷新失败不影响使用 */ }
}

/** 处理一批笔画（顺序播放），播放期间淡出底栏避免遮挡 */
function handleStrokes(strokes) {
  strokeSeq++;
  queue = queue.then(async () => {
    controlsEl.classList.add("dim");
    try {
      for (const s of strokes) {
        totalStrokes++;
        progEl.textContent = totalStrokes + tr("strokeUnit");
        labelEl.textContent = "✏️ " + (s.label || "绘制");
        await playStroke(s);
      }
      labelEl.textContent = tr("batchDone");
      hidePen(); // 本批画完，抬笔淡出（CSS opacity 过渡）
    } finally {
      controlsEl.classList.remove("dim");
    }
  });
}

function clearCanvas() {
  strokeSeq++;
  content.innerHTML = "";
  totalStrokes = 0;
  penPos = null;
  hidePen();
  deselect();
  progEl.textContent = "0" + tr("strokeUnit");
  labelEl.textContent = tr("cleared");
}

// ---------- 元素点选高亮 ----------
const overlay = document.getElementById("overlay");
const selChip = document.getElementById("selChip");
const selLabel = document.getElementById("selLabel");
let selectedId = null;
let elMetaCache = null; // /state 的 occupied 元数据（label/type），选中时懒加载，画布有变动即失效

function deselect() {
  selectedId = null;
  overlay.innerHTML = "";
  selChip.hidden = true;
  hideDescPop();
}

async function selectElement(g) {
  const id = g.getAttribute("data-element-id");
  if (!id) return;
  selectedId = id;
  // 在 overlay 里加一圈苗边（不遮挡原对象，外圈光晕同步呼吸由 CSS 负责）
  const bb = g.getBBox();
  const pad = 8;
  overlay.innerHTML = "";
  const ring = svgNS("rect");
  ring.setAttribute("x", bb.x - pad);
  ring.setAttribute("y", bb.y - pad);
  ring.setAttribute("width", bb.width + pad * 2);
  ring.setAttribute("height", bb.height + pad * 2);
  ring.setAttribute("rx", "8");
  ring.setAttribute("class", "sel-ring");
  overlay.appendChild(ring);
  // 元素 label/type（客户端只有笔画，元数据从 /state 取）
  if (!elMetaCache) {
    elMetaCache = {};
    try {
      const res = await fetch("/state?board=" + encodeURIComponent(board));
      const data = await res.json();
      for (const e of data.occupied ?? []) elMetaCache[e.id] = e;
    } catch { /* ignore */ }
  }
  if (selectedId !== id) return; // 等待期间已改选/取消
  const meta = elMetaCache[id];
  // 优先取 desc（agent 写的自然语言说明），没有再 fallback
  const displayLabel = (meta?.meta && meta.meta.desc) || meta?.label || meta?.type || "元素";
  selLabel.textContent = displayLabel + " ";
  const idSpan = document.createElement("span");
  idSpan.className = "sel-id";
  idSpan.textContent = id;
  selLabel.appendChild(idSpan);
  selChip.hidden = false;
}

/** 双击元素 → 弹出说明浮窗 */
let descPopEl = null;
function showDescPop(clientX, clientY) {
  hideDescPop();
  if (!selectedId) return;
  const meta = elMetaCache?.[selectedId];
  if (!meta) return;
  // 优先取 meta.desc（agent 写的说明），没有再 fallback
  const desc = (meta.meta && meta.meta.desc) || meta.label || meta.type || "无说明";
  const order = meta.z ?? "—";
  const id = selectedId;
  const pop = document.createElement("div");
  pop.className = "desc-pop";
  pop.innerHTML = `
    <div class="desc-title">对象说明</div>
    <div class="desc-body">${escHtml(desc)}</div>
    <div class="desc-order">画图顺序 #${order} · ID: ${escHtml(id)}</div>
  `;
  // 屏幕坐标定位，避免溢出
  pop.style.left = Math.min(clientX + 12, window.innerWidth - 300) + "px";
  pop.style.top = Math.min(clientY + 12, window.innerHeight - 140) + "px";
  document.body.appendChild(pop);
  descPopEl = pop;
  // 4 秒后或点击外部自动消失
  setTimeout(() => { if (descPopEl === pop) hideDescPop(); }, 6000);
  const onClick = (e) => {
    if (pop.contains(e.target)) return;
    hideDescPop();
    document.removeEventListener("mousedown", onClick);
  };
  setTimeout(() => document.addEventListener("mousedown", onClick), 0);
}
function hideDescPop() {
  if (descPopEl) { descPopEl.remove(); descPopEl = null; }
}
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// ---------- WebSocket 实时接收 ----------
let ws = null;
/** Agent 工作呼吸灯：思考+作画期间点亮（AIPex 风格三点脉冲 + 整页呼吸光环） */
const agentPulse = document.getElementById("agentPulse");
/** 本页面观察到过 agent 工作才触发结束后的静默刷新（连接时的状态同步不触发） */
let sawAgentWorking = false;
function setAgentLight(working) {
  document.body.classList.toggle("agent-working", working);
  agentPulse.hidden = !working;
}
/** 连接后收到的第一批 = 服务器回放的历史内容，直接静态渲染，不重新播放动画 */
let expectReplay = true;
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?board=${encodeURIComponent(board)}`);
  window.__wsState = "connecting";
  ws.onopen = () => { window.__wsState = "open"; wsDot.className = "dot on"; labelEl.textContent = tr("waiting"); };
  ws.onmessage = (ev) => {
    window.__msgCount = (window.__msgCount || 0) + 1;
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "agent") {
        setAgentLight(!!msg.working);
        if (msg.working) sawAgentWorking = true;
        else if (sawAgentWorking) { sawAgentWorking = false; scheduleSilentRefresh(); }
        return;
      }
      elMetaCache = null; // 画布有变动，元素元数据缓存失效
      if (msg.type === "clear") { expectReplay = false; clearCanvas(); return; }
      if (msg.type === "remove") {
        expectReplay = false;
        content.querySelectorAll(`g.el[data-element-id="${msg.elementId}"]`).forEach((el) => el.remove());
        if (msg.elementId === selectedId) deselect();
        labelEl.textContent = tr("removedEl", { id: msg.elementId });
        return;
      }
      if (msg.type === "update") {
        expectReplay = false;
        content.querySelectorAll(`g.el[data-element-id="${msg.elementId}"]`).forEach((el) => el.remove());
        if (msg.elementId === selectedId) deselect();
        handleStrokes(msg.strokes.map((s) => ({ ...s, elementId: msg.elementId, z: msg.z ?? s.z })));
        return;
      }
      if (msg.type === "batch") {
        if (expectReplay) { expectReplay = false; renderInstant(msg.strokes); labelEl.textContent = tr("restored"); return; }
        handleStrokes(msg.strokes);
        return;
      }
      if (msg.type === "stroke") { expectReplay = false; handleStrokes([msg]); return; }
    } catch (e) {
      window.__lastErr = e.message;
    }
  };
  ws.onclose = () => {
    window.__wsState = "closed";
    setAgentLight(false);
    expectReplay = true; // 重连后服务器会再次回放全量历史
    wsDot.className = "dot off";
    labelEl.textContent = tr("disconnected");
    setTimeout(connect, 1500);
  };
  ws.onerror = () => { window.__wsState = "error"; ws.close(); };
}

/** 探测是否为 web-agent 模式（服务器挂了 /api/agent/info 才显示聊天入口） */
async function initAgent() {

}
function closeChat() {
  chatPanel.classList.add("closed");
  chatLauncher.hidden = false;
  setTimeout(() => { if (chatPanel.classList.contains("closed")) chatPanel.hidden = true; }, 380);
}
async function loadHistory() {
  try {
    const res = await fetch("/api/chat/history");
    const data = await res.json();
    for (const m of data.messages ?? []) addMsg(m.role === "user" ? "user" : "agent", m.content);
  } catch { /* ignore */ }
}
function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chatMsgs.appendChild(div);
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
  return div;
}
function addThinking() {
  const div = document.createElement("div");
  div.className = "msg agent thinking";
  div.innerHTML = "<i></i><i></i><i></i>";
  chatMsgs.appendChild(div);
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
  return div;
}
function autoGrow() {
  chatText.style.height = "auto";
  chatText.style.height = Math.min(chatText.scrollHeight, 96) + "px";
}
async function sendChat() {
  const text = chatText.value.trim();
  if (!text || chatBusy) return;
  addMsg("user", text);
  chatText.value = "";
  autoGrow();
  chatBusy = true;
  chatSend.disabled = true;
  const thinking = addThinking();
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, board }),
    });
    const data = await res.json().catch(() => ({}));
    thinking.remove();
    addMsg("agent", res.ok ? (data.reply || "…") : "⚠️ " + (data.error || ("HTTP " + res.status)));
  } catch {
    thinking.remove();
    addMsg("agent", tr("netErr"));
  }
  chatBusy = false;
  chatSend.disabled = false;
  chatText.focus();
}
chatLauncher.addEventListener("click", openChat);
document.getElementById("chatClose").addEventListener("click", closeChat);
chatSend.addEventListener("click", sendChat);
chatText.addEventListener("input", autoGrow);
chatText.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); }
});
initAgent();
initBoard();
</script>
</body>
</html>
