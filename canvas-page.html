<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>✏️ 实时画布</title>
<style>
  :root {
    --bg: #f6f7f9;
    --grid-dot: #dde0e7;
    --island: rgba(255, 255, 255, 0.86);
    --border: rgba(16, 24, 40, 0.08);
    --ink: #171b21;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: rgba(79, 70, 229, 0.1);
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 8px 24px rgba(16, 24, 40, 0.1);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 画布底色：冷调中性 + 圆点网格，无限画布的现代语言 */
  .stage {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: var(--bg);
    background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1.2px);
    background-size: 22px 22px;
    background-position: center;
  }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  /* 悬浮玻璃岛：顶栏状态条与底栏工具条共用 */
  .hud {
    position: fixed; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: var(--island);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    z-index: 10; user-select: none;
    font-size: 13px; color: var(--ink);
    transition: opacity 0.35s ease;
  }
  /* 作画时底栏淡出，不挡笔画；悬停随时恢复 */
  .hud.dim { opacity: 0.25; }
  .hud:hover { opacity: 1; }
  .toast { top: 16px; padding: 8px 14px; }
  .toast .label { color: var(--ink); font-weight: 500; letter-spacing: 0.01em; }
  .toast .board {
    background: var(--accent-soft); color: var(--accent);
    font-weight: 600; font-size: 12px;
    padding: 3px 8px; border-radius: 6px;
  }
  .toast .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  /* WebSocket 实时状态呼吸灯 */
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; flex: none; transition: background 0.3s; }
  .dot.on { background: #22c55e; animation: pulse 2.2s ease-in-out infinite; }
  .dot.off { background: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18); }
    50% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.05); }
  }
  @media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
  /* ---------- Agent 工作呼吸灯（抄自 AIPex） ---------- */
  /* AIPex Thinking.tsx：三个蓝色小点交错脉冲（animate-pulse 1.4s，延迟 0/200/400ms） */
  .agent-pulse { display: inline-flex; align-items: center; gap: 4px; }
  .agent-pulse i {
    width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; /* blue-500 */
    animation: agentPulse 1.4s cubic-bezier(.4, 0, .6, 1) infinite;
  }
  .agent-pulse i:nth-child(2) { animation-delay: 200ms; }
  .agent-pulse i:nth-child(3) { animation-delay: 400ms; }
  @keyframes agentPulse { 50% { opacity: .5; } } /* tailwind animate-pulse 原样 */
  .agent-label { color: #2563eb; font-weight: 500; }
  /* aipex-company breathing-border-overlay.tsx 原样照搬：4 层递进蓝色 inset 光晕呼吸 */
  #breath {
    position: fixed; inset: 0; pointer-events: none; z-index: 9;
    opacity: 0; transition: opacity 0.5s ease-in-out;
  }
  body.agent-working #breath { opacity: 1; animation: breatheInwardGlow 2.5s ease-in-out infinite; }
  @keyframes breatheInwardGlow {
    0%, 100% {
      box-shadow:
        inset 0 0 12px 3px rgba(37, 99, 235, 0.35),
        inset 0 0 20px 5px rgba(59, 130, 246, 0.28),
        inset 0 0 28px 6px rgba(96, 165, 250, 0.22),
        inset 0 0 35px 8px rgba(147, 197, 253, 0.15);
    }
    50% {
      box-shadow:
        inset 0 0 20px 5px rgba(37, 99, 235, 0.7),
        inset 0 0 30px 7px rgba(59, 130, 246, 0.6),
        inset 0 0 40px 9px rgba(96, 165, 250, 0.5),
        inset 0 0 50px 11px rgba(147, 197, 253, 0.35);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .agent-pulse i, body.agent-working #breath { animation: none; }
  }
  .controls { bottom: 18px; padding: 6px; gap: 4px; }
  /* 幽灵按钮：透明底，hover 才浮现 */
  button, select {
    border: 1px solid transparent; background: transparent; color: var(--ink);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; font-family: inherit;
    cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
  }
  button:hover, select:hover { background: rgba(16, 24, 40, 0.06); }
  button:active { background: rgba(16, 24, 40, 0.1); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #btnClear:hover { color: var(--danger); background: rgba(220, 38, 38, 0.08); }
  /* 底栏画板切换按钮：左侧画板名 + 下箭头 */
  #boardSwitcher {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; font-size: 13px; font-weight: 500;
    color: var(--ink);
  }
  #boardSwitcher .bs-arrow { font-size: 10px; color: var(--muted); transition: transform 0.2s ease; }
  #boardSwitcher[aria-expanded="true"] .bs-arrow { transform: rotate(180deg); }
  /* 画板卡片浮层：玻璃风，固定宽度网格 */
  .board-pop {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    width: min(720px, calc(100vw - 32px));
    max-height: 70vh; overflow-y: auto;
    background: var(--island);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 2px 4px rgba(16, 24, 40, 0.05), 0 16px 48px rgba(16, 24, 40, 0.16);
    z-index: 14;
    padding: 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .board-card {
    display: flex; flex-direction: column;
    border: 1px solid var(--border); border-radius: 10px;
    background: #fff; cursor: pointer; overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    text-align: left;
  }
  .board-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(16, 24, 40, 0.08);
    border-color: var(--accent);
  }
  .board-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .board-card .card-thumb {
    width: 100%; height: 110px; background: #f6f7f9;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .board-card .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .board-card .card-thumb .thumb-empty {
    color: var(--muted); font-size: 12px; font-style: italic;
  }
  .board-card .card-body {
    padding: 10px 12px; display: flex; flex-direction: column; gap: 3px;
  }
  .board-card .card-name {
    font-size: 13px; font-weight: 600; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .board-card .card-meta {
    font-size: 11px; color: var(--muted); display: flex; justify-content: space-between;
  }
  .board-pop .pop-header {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
    margin: -4px 0 4px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .board-pop .pop-header .ph-title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .board-pop .pop-header .ph-close {
    padding: 2px 8px; font-size: 13px; color: var(--muted);
  }
  .board-pop .pop-header .ph-close:hover { color: var(--ink); }
  .board-pop .pop-empty {
    grid-column: 1 / -1;
    padding: 32px 16px; text-align: center;
    color: var(--muted); font-size: 12.5px;
  }
  select { border-color: var(--border); background: #fff; }
  #hint {
    color: var(--muted); font-size: 12px;
    border-left: 1px solid var(--border);
    padding-left: 10px; margin-left: 4px;
  }
  [hidden] { display: none !important; }
  /* ---------- 新建画板弹层 ---------- */
  .nb-pop {
    position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; padding: 8px;
    background: var(--island);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); z-index: 12;
  }
  .nb-pop input {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font: inherit; font-size: 13px;
    background: #fff; width: 170px;
  }
  .nb-pop input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nb-pop .ok { background: var(--accent); color: #fff; }
  .nb-pop .ok:hover { background: #4338ca; }
  /* ---------- 右上角 Agent 信息 ---------- */
  .agent-launcher {
    position: fixed; right: 16px; top: 16px;
    width: 44px; height: 44px; border-radius: 50%; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--island);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid var(--border); box-shadow: var(--shadow); z-index: 11;
  }
  .agent-launcher:hover { background: #fff; }
  .agent-launcher svg { width: 20px; height: 20px; }
  .agent-pop {
    position: fixed; right: 16px; top: 68px;
    width: 330px; max-width: calc(100vw - 32px); max-height: 72vh; overflow-y: auto;
    background: var(--island);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 2px 4px rgba(16, 24, 40, 0.05), 0 16px 48px rgba(16, 24, 40, 0.16);
    z-index: 14; padding: 14px 16px; font-size: 12.5px; color: var(--ink);
  }
  .agent-pop h3 { margin: 0 0 6px; font-size: 13px; }
  .agent-pop .sec { margin-top: 12px; }
  .agent-pop .sec-title { color: var(--muted); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .agent-pop .item { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; line-height: 1.45; }
  .agent-pop .item .desc { color: var(--muted); flex: 1; min-width: 0; }
  .agent-pop .tag { color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; font-size: 10.5px; flex: none; }
  .agent-pop .empty { color: var(--muted); font-style: italic; }
  .agent-pop .kv b { font-weight: 600; word-break: break-all; }
  .agent-pop .model-row { display: flex; gap: 6px; align-items: center; }
  .agent-pop .model-select { flex: 1; min-width: 0; padding: 6px 8px; font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--border); border-radius: 7px; }
  .agent-pop .model-refresh { padding: 6px 8px; font: inherit; color: var(--accent); background: var(--accent-soft); border: 1px solid transparent; border-radius: 7px; white-space: nowrap; }
  .agent-pop .model-refresh:hover:not(:disabled) { border-color: var(--accent); }
  .agent-pop .model-refresh:disabled, .agent-pop .model-select:disabled { opacity: 0.6; cursor: wait; }
  .agent-pop .model-note { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.4; }
  .agent-pop .model-note.error { color: var(--danger); }
  .icon { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  /* ---------- 蚂蚁助手（左下角）+ 气泡 + 输入/历史浮窗 ---------- */
  /* 蚂蚁本体：HTML 元素，absolute 定位 + transform 平移；图片本身宽高固定，位置由 JS 写入 */
  #ant, #worker, .worker-ant {
    position: fixed; left: 0; top: 0;
    width: 66px; height: 66px;
    z-index: 11;
    cursor: pointer;
    pointer-events: auto;
    user-select: none;
    transition: transform 0.18s ease;
    will-change: transform;
    /* 落点在画布上时不要画自己的阴影，方便看清笔画 */
    filter: drop-shadow(0 4px 8px rgba(40, 30, 20, 0.22));
  }
  /* 工蚁始终显示在右下角或当前笔画处，不接受交互。 */
  #worker, .worker-ant { cursor: default; pointer-events: none; }
  #ant.dragging { cursor: grabbing; }
  /* 工蚁作画时以极短线性过渡追随笔迹：消除瞬移，同时不明显落后于笔尖。 */
  #worker.busy, .worker-ant.busy { cursor: default; transition: transform 45ms linear; animation: antBreathe 2.4s ease-in-out infinite; }
  /* 输入浮窗打开时，蚁后不能点击；三个浮层的入口保持互斥。 */
  body.input-open #ant { pointer-events: none; cursor: default; }
  /* 工作状态时给蚂蚁加个轻呼吸阴影脉动（不要改 transform，避免覆盖 inline translate） */
  @keyframes antBreathe {
    0%, 100% { filter: drop-shadow(0 6px 14px rgba(40, 30, 20, 0.18)); }
    50%      { filter: drop-shadow(0 10px 22px rgba(40, 30, 20, 0.32)); }
  }
  #ant img, #worker img, .worker-ant img {
    width: 100%; height: 100%;
    display: block;
    /* 默认朝右（待机的正面思考图，朝向屏幕右边，画在右侧）；背面图朝向左边 */
    transform: scaleX(-1);
    transition: transform 0.25s ease;
    pointer-events: none;
  }
  /* 背面握笔图（工作状态）原始朝向是右边带笔尖，所以去掉翻转 */
  /* 工蚁始终保持握笔图原始朝向；蚁后才使用镜像朝向。 */
  #worker img, .worker-ant img, #worker.flip-off img { transform: none; }
  /* ---------- 气泡：始终跟随蚂蚁右上角 ---------- */
  #queenSpeech, .worker-speech {
    position: fixed; left: 0; top: 0;
    z-index: 12;
    /* 气泡随逐字输出自然长大；到达屏幕安全宽度后再换行增高。 */
    width: fit-content;
    min-width: 64px;
    max-width: min(280px, calc(100vw - 16px));
    max-height: 28vh;
    overflow: hidden;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 6px 22px rgba(16, 24, 40, 0.12), 0 2px 4px rgba(16, 24, 40, 0.05);
    font-size: 12.5px; line-height: 1.5; color: var(--ink);
    /* 容器不保留模板缩进换行；仅正文保留 agent 输出中的换行。 */
    white-space: normal; word-break: break-word;
    transform: translate(var(--pop-x, 0px), var(--pop-y, 0px));
    transform-origin: var(--pop-origin-x, 50%) var(--pop-origin-y, 100%);
    transition: opacity 0.18s ease;
    pointer-events: none;
  }
  /* 所有浮层都从蚂蚁所在位置弹出，避免像从页面顶部掉下来。 */
  #queenSpeech.pop-in, .worker-speech.pop-in, #inputPop.pop-in, #historyPop.pop-in {
    animation: popFromAnt 520ms cubic-bezier(0.18, 0.82, 0.25, 1.18) both;
  }
  @keyframes popFromAnt {
    from { opacity: 0; transform: translate(var(--pop-x, 0px), var(--pop-y, 0px)) scale(0.12); }
    to { opacity: 1; transform: translate(var(--pop-x, 0px), var(--pop-y, 0px)) scale(1); }
  }
  #queenSpeech .b-body, .worker-speech .b-body {
    max-height: 30vh; overflow-y: auto; white-space: pre-wrap;
  }
  #queenSpeech.empty .b-body, .worker-speech.empty .b-body { color: var(--muted); font-style: italic; }
  #queenSpeech.idle .b-body, .worker-speech.idle .b-body { color: var(--ink); }
  #queenSpeech.busy .b-body, .worker-speech.busy .b-body { color: var(--ink); }
  /* 思考/推理气泡：灰色斜体+“💭”表示中间状态；被最终 text 覆盖后移除。 */
  #queenSpeech.thinking .b-body, .worker-speech.thinking .b-body { color: #6b6b76; font-style: italic; }
  #queenSpeech.thinking .b-body::before, .worker-speech.thinking .b-body::before { content: "💭 "; opacity: 0.85; font-style: normal; }
  /* 工蚁气泡：贴各自工蚁蚂蚁，默认收起 4 个气泡；size 与蚁后一致。 */
  .worker-speech { max-width: 260px; font-size: 12px; }
  #queenSpeech .b-tail, .worker-speech .b-tail {
    position: absolute;
    bottom: -8px;
    width: 14px; height: 14px;
    background: rgba(255, 255, 255, 0.95);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    transform: rotate(45deg);
  }
  /* 气泡在蚂蚁下方时，尾巴翻到顶部，仍准确指向蚂蚁。 */
  #queenSpeech .b-tail.tail-top, .worker-speech .b-tail.tail-top {
    top: -8px; bottom: auto;
    border-right: 0; border-bottom: 0;
    border-left: 1px solid var(--border);
    border-top: 1px solid var(--border);
  }
  /* ---------- 输入浮窗（点击蚂蚁弹出） ---------- */
  #inputPop {
    position: fixed; left: 0; top: 0;
    z-index: 13;
    width: 320px; max-width: calc(100vw - 32px);
    background: var(--island);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 6px 22px rgba(16, 24, 40, 0.12), 0 2px 4px rgba(16, 24, 40, 0.05);
    padding: 12px 12px 10px;
    transform: translate(var(--pop-x, 0px), var(--pop-y, 0px));
    transform-origin: var(--pop-origin-x, 50%) var(--pop-origin-y, 100%);
    transition: opacity 0.18s ease;
  }
  #inputPop .head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  #inputPop .head .h-title { font-size: 13px; font-weight: 600; }
  #inputPop .head .h-hint { color: var(--muted); font-size: 11px; margin-left: 4px; }
  #inputPop .head .h-close { margin-left: auto; padding: 2px 8px; font-size: 13px; }
  #inputPop textarea {
    width: 100%; resize: none; border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; font: inherit; font-size: 13px; background: #fff;
    min-height: 64px; max-height: 160px; line-height: 1.45;
  }
  #inputPop textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #inputPop .row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px;
  }
  #inputPop .row .err { color: var(--danger); font-size: 12px; flex: 1; }
  #inputPop .row .send-btn {
    background: var(--accent); color: #fff; border-radius: 10px;
    padding: 6px 14px; font-size: 13px;
  }
  #inputPop .row .send-btn:hover { background: #4338ca; }
  #inputPop .row .send-btn:disabled { opacity: 0.5; cursor: default; }
  /* ---------- 历史浮窗（双击蚂蚁弹出） ---------- */
  #historyPop {
    position: fixed; left: 0; top: 0;
    z-index: 13;
    width: 340px; max-width: calc(100vw - 32px);
    max-height: 60vh;
    display: flex; flex-direction: column;
    background: var(--island);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 6px 22px rgba(16, 24, 40, 0.12), 0 2px 4px rgba(16, 24, 40, 0.05);
    transform: translate(var(--pop-x, 0px), var(--pop-y, 0px));
    transform-origin: var(--pop-origin-x, 50%) var(--pop-origin-y, 100%);
    transition: opacity 0.18s ease;
  }
  #historyPop .head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 10px; border-bottom: 1px solid var(--border);
  }
  #historyPop .head .h-title { font-weight: 600; font-size: 13px; }
  #historyPop .head .h-count { color: var(--muted); font-size: 11px; margin-left: 4px; }
  #historyPop .head .h-close { margin-left: auto; padding: 2px 8px; font-size: 13px; }
  #historyPop .msgs {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  #historyPop .msg {
    max-width: 88%; padding: 7px 11px; border-radius: 12px;
    font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  #historyPop .msg.user {
    align-self: flex-end; background: var(--accent); color: #fff;
    border-bottom-right-radius: 4px;
  }
  #historyPop .msg.agent {
    align-self: flex-start; background: rgba(79, 70, 229, 0.10); color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  #historyPop .msg.system, #historyPop .msg.worker {
    align-self: flex-start; background: rgba(16, 24, 40, 0.06); color: var(--muted);
    border-left: 3px solid var(--accent); border-radius: 8px;
    font-size: 11.5px;
  }
  #historyPop .msg.worker { border-left-color: #d97706; }
  #historyPop .msg-role { display: block; font-size: 10px; font-weight: 600; opacity: .72; margin-bottom: 2px; }
  #historyPop .empty { color: var(--muted); font-style: italic; font-size: 12px; padding: 12px; }
  /* ---------- 元素选中：蚂蚁线高亮框 + 操作条 ---------- */
  .sel-rect {
    fill: rgba(79, 70, 229, 0.07); stroke: var(--accent);
    stroke-width: 1.5; stroke-dasharray: 6 4;
    animation: march 0.8s linear infinite;
  }
  @keyframes march { to { stroke-dashoffset: -10; } }
  @media (prefers-reduced-motion: reduce) { .sel-rect { animation: none; } }
  /* ---------- 选中高亮：外圈苗边 + 柔光呼吸（不作用于原对象本身） ---------- */
  .sel-ring {
    fill: none;
    stroke: #6c8cff;
    stroke-width: 2;
    rx: 8;
    pointer-events: none;
    animation: ringBreathe 1.8s ease-in-out infinite;
  }
  @keyframes ringBreathe {
    0%, 100% {
      stroke-width: 1.6;
      stroke-opacity: 0.7;
      filter: drop-shadow(0 0 2px rgba(108, 140, 255, 0.35));
    }
    50% {
      stroke-width: 3;
      stroke-opacity: 1;
      filter: drop-shadow(0 0 6px rgba(108, 140, 255, 0.65));
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .sel-ring { animation: none; }
  }
  /* ---------- 双击说明浮窗 ---------- */
  .desc-pop {
    position: fixed;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid rgba(108, 140, 255, 0.35);
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: 0 8px 28px rgba(108, 140, 255, 0.25), 0 2px 6px rgba(16, 24, 40, 0.08);
    z-index: 20;
    max-width: 280px;
    font-size: 13px;
    line-height: 1.5;
    color: #171b21;
    animation: popIn 0.18s ease-out;
  }
  .desc-pop .desc-title {
    font-size: 11px;
    color: #6c8cff;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .desc-pop .desc-body { color: #171b21; }
  .desc-pop .desc-order {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(108, 140, 255, 0.25);
    font-size: 11px;
    color: #6b7280;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(-4px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .sel-chip { top: 16px; left: 16px; transform: none; padding: 6px 8px 6px 12px; gap: 6px; }
  .sel-chip .sel-label {
    font-size: 12px; color: var(--ink); max-width: 240px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sel-chip .sel-id { color: var(--muted); }
  #selDelete:hover { color: var(--danger); background: rgba(220, 38, 38, 0.08); }
  /* ---------- 工蚁区域可视化 ---------- */
  .worker-region-rect {
    fill: rgba(0, 0, 0, 0.02);
    stroke-width: 1.5;
    stroke-dasharray: 6 4;
    pointer-events: none;
    animation: workerRegionIn 0.25s ease-out forwards;
  }
  @keyframes workerRegionIn { from { opacity: 0; } to { opacity: 0.6; } }
  .worker-region-rect.w1 { stroke: #3b82f6; }
  .worker-region-rect.w2 { stroke: #22c55e; }
  .worker-region-rect.w3 { stroke: #f97316; }
  .worker-region-rect.w4 { stroke: #a855f7; }
  .worker-region-label {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    font-size: 11px; font-weight: 600;
    fill: white;
    paint-order: stroke;
    stroke: rgba(0, 0, 0, 0.45);
    stroke-width: 2.5;
    pointer-events: none;
    animation: workerRegionIn 0.25s ease-out forwards;
  }
  /* 持久态：drawing 时一直显示，done/idle 才淡出 */
  .worker-region-rect.fading, .worker-region-label.fading {
    animation: workerRegionOut 0.6s ease-in forwards;
  }
  @keyframes workerRegionOut { from { opacity: 0.6; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .worker-region-rect, .worker-region-label { animation: none; opacity: 0.6; }
  }
</style>
</head>
<body>
<div class="stage">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <g id="content"></g>
    <g id="overlay" pointer-events="none"></g>
  </svg>
  <div class="toast hud"><span class="dot" id="wsDot"></span><span class="board" id="boardName"></span><span class="agent-pulse" id="agentPulse" hidden><i></i><i></i><i></i><span class="agent-label">AI 思考 / 作画中…</span></span><span class="label" id="curLabel">…</span><span class="progress" id="progress">0</span></div>
  <div id="breath"></div>
  <div class="controls hud">
    <button id="boardSwitcher" onclick="toggleBoardPop()" title="切换画板"><span id="boardSwitcherName">…</span><span class="bs-arrow">▾</span></button>
    <button onclick="toggleNbPop()" id="btnNewBoard" title="新建画板">＋</button>
    <button onclick="resetView()" id="btnFit">适应</button>
    <button onclick="location.reload()" id="btnRefresh">刷新</button>
    <button onclick="replayCanvas()" id="btnReplay" title="按原始书写顺序重新播放全部笔画">回放</button>
    <button onclick="clearBoard()" id="btnClear">清空</button>
    <span id="hint">滚轮缩放 · 拖拽平移 · 实时连接</span>
  </div>
  <div class="board-pop" id="boardPop" hidden></div>
  <div class="nb-pop" id="nbPop" hidden>
    <input id="nbName" placeholder="新画板名" maxlength="60">
    <button class="ok" onclick="createBoardFromPop()" id="nbOk">创建</button>
  </div>
  <div class="sel-chip hud" id="selChip" hidden>
    <span class="sel-label" id="selLabel"></span>
    <button id="selQuote">引用</button>

  <button class="agent-launcher" id="agentLauncher" title="Agent 信息" aria-label="Agent 信息"><svg class="icon" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 2v3M14 2v3M10 19v3M14 19v3M2 10h3M2 14h3M19 10h3M19 14h3"/></svg></button>
  <div class="agent-pop" id="agentPop" hidden></div>
  <!-- 蚁后固定在左下角：唯一的输入 / 历史入口，始终可见。 -->
  <div id="ant" aria-label="蚁后助手" hidden>
    <img id="antImg" alt="queen ant" draggable="false" src="/ant/ant-front-thinking.png">
  </div>
  <!-- 工蚁固定从右下角待命；作画时才移动到笔画处，始终可见。 -->
  <div id="worker" class="worker-ant" aria-label="作画工蚁 1" hidden>
    <img id="workerImg-1" alt="worker ant 1" draggable="false" src="/ant/ant-back-with-pen.png">
  </div>
  <!-- 两个角色各自拥有气泡，互不抢占。 -->
  <div id="queenSpeech" class="empty idle" aria-live="polite" hidden><div class="b-tail"></div><div class="b-body"></div></div>
  <!-- 工蚁 1 的默认气泡保留在 DOM；worker-2/3/4 会在收到 speech 时动态创建。 -->
  <div id="worker-1-speech" class="empty worker-speech" aria-live="polite" hidden><div class="b-tail"></div><div class="b-body"></div></div>
  <!-- 输入浮窗（点击蚂蚁弹出） -->
  <div id="inputPop" hidden>
    <div class="head">
      <span class="h-title">告诉蚂蚁要画什么</span>
      <span class="h-hint">回车发送 · Shift+回车换行</span>
      <button class="h-close" id="inputClose" title="关闭">✕</button>
    </div>
    <textarea id="inputText" rows="3" placeholder="例如：画一个 Kafka 消息总线的架构图…"></textarea>
    <div class="row">
      <span class="err" id="inputErr"></span>
      <button class="send-btn" id="inputSend">发送</button>
    </div>
  </div>
  <!-- 历史浮窗（双击蚂蚁弹出） -->
  <div id="historyPop" hidden>
    <div class="head">
      <span class="h-title">本次会话记录</span>
      <span class="h-count" id="historyCount"></span>
      <button class="h-close" id="historyClose" title="关闭">✕</button>
    </div>
    <div class="msgs" id="historyMsgs"></div>
  </div>
</div>
<script>
// ---------- i18n（由服务器注入；直接打开文件时用兜底中文） ----------
const I18N = {
  title: "✏️ 实时画布", waiting: "等待 AI 动笔…", strokeUnit: " 笔", batchDone: "✅ 本批完成",
  cleared: "画布已清空", restored: "已恢复画布，等待 AI 动笔…", disconnected: "连接断开，重连中…",
  removedEl: "🗑️ 已删除元素 {id}", fit: "适应", refresh: "刷新", clear: "清空",
  replay: "回放", replaying: "▶ 回放中…", replayDone: "✅ 回放完成", replayBusy: "AI 正在作画，等它画完再回放",
  clearConfirm: "确定清空当前画板？所有笔画都会被删除。",
  hint: "滚轮缩放 · 拖拽平移 · 实时连接", board: "画板",
  newBoard: "新建画板", nbPh: "新画板名", create: "创建",
  // 蚂蚁 + 气泡 + 输入 / 历史 浮窗
  antIdleHint: "点我告诉我要画点什么",
  antWorkingTitle: "蚂蚁正在画",
  antWorkingEmpty: "思考中…",
  inputTitle: "告诉蚂蚁要画什么",
  inputHint: "回车发送 · Shift+回车换行",
  inputPh: "例如：画一个 Kafka 消息总线的架构图…",
  inputSend: "发送",
  inputErrBusy: "上一条还在处理中，请稍等",
  inputErrNet: "⚠️ 网络错误，请稍后再试",
  inputErrBad: "⚠️ 请求失败，请稍后再试",
  historyTitle: "本次会话记录",
  historyEmpty: "本次会话还没有消息，双击空白处开始记录。",
  // agent 未配置 / 错误
  noCfg: "未配置模型 API Key：请设置 HANDDRAW_LLM_API_KEY 后重启 agent。",
  netErr: "⚠️ 网络错误，请稍后再试",
  // 画板卡片浮层
  boardPopTitle: "切换画板",
  boardPopEmpty: "空白画板",
  boardPopThumbFail: "无缩略图",
  boardCardCount: "{n} 个元素",
  boardJustNow: "刚刚",
  boardMinAgo: "{n} 分钟前",
  boardHourAgo: "{n} 小时前",
  boardDayAgo: "{n} 天前",
};
function tr(key, vars) {
  let s = I18N[key] ?? key;
  if (vars) for (const k of Object.keys(vars)) s = s.replaceAll("{" + k + "}", String(vars[k]));
  return s;
}
document.title = tr("title");
document.getElementById("btnFit").textContent = tr("fit");
document.getElementById("btnRefresh").textContent = tr("refresh");
document.getElementById("btnReplay").textContent = tr("replay");
document.getElementById("btnClear").textContent = tr("clear");
document.getElementById("hint").textContent = tr("hint");
document.getElementById("btnNewBoard").title = tr("newBoard");
document.getElementById("nbName").placeholder = tr("nbPh");
document.getElementById("nbOk").textContent = tr("create");
document.getElementById("inputText").placeholder = tr("inputPh");
document.getElementById("inputSend").textContent = tr("inputSend");

// ---------- 画板：项目卡片切换 ----------
let board = new URLSearchParams(location.search).get("board") || "";
const boardNameEl = document.getElementById("boardName");
const boardSwitcher = document.getElementById("boardSwitcher");
const boardSwitcherName = document.getElementById("boardSwitcherName");
const boardPop = document.getElementById("boardPop");
let boardPopOpen = false;
async function initBoard() {
  // 顶栏 toast 文案初始化（不依赖 boardList，避免加载顺序耦合）
  try {
    const res = await fetch("/api/boards");
    const data = await res.json();
    if (!board) board = data.active || "default";
  } catch { if (!board) board = "default"; }
  boardNameEl.textContent = tr("board") + " · " + board;
  boardSwitcherName.textContent = board;
  restoreView(); // 恢复该画板上次的视角
  connect();
}
async function loadBoardList() {
  let boards = [];
  try {
    const res = await fetch("/api/boards");
    const data = await res.json();
    boards = data.boards ?? [];
  } catch { /* 失败也允许用户继续 */ }
  boardPop.innerHTML = "";
  // 头部：标题 + 关闭
  const header = document.createElement("div");
  header.className = "pop-header";
  header.innerHTML = `<span class="ph-title">${tr("boardPopTitle") || "切换画板"}</span><button class="ph-close" id="boardPopClose">✕</button>`;
  boardPop.appendChild(header);
  document.getElementById("boardPopClose").addEventListener("click", closeBoardPop);
  if (!boards.length) {
    const empty = document.createElement("div");
    empty.className = "pop-empty";
    empty.textContent = tr("boardPopEmpty") || "暂无画板";
    boardPop.appendChild(empty);
    return;
  }
  for (const b of boards) {
    const card = document.createElement("button");
    card.className = "board-card" + (b.name === board ? " active" : "");
    card.dataset.name = b.name;
    const thumb = document.createElement("div");
    thumb.className = "card-thumb";
    if (b.thumbnail) {
      const img = document.createElement("img");
      img.src = b.thumbnail;
      img.alt = b.name;
      img.loading = "lazy";
      img.onerror = () => { img.replaceWith(Object.assign(document.createElement("div"), { className: "thumb-empty", textContent: tr("boardPopThumbFail") || "无缩略图" })); };
      thumb.appendChild(img);
    } else {
      const empty = document.createElement("div");
      empty.className = "thumb-empty";
      empty.textContent = tr("boardPopEmpty") || "空白画板";
      thumb.appendChild(empty);
    }
    const body = document.createElement("div");
    body.className = "card-body";
    const name = document.createElement("div");
    name.className = "card-name";
    name.textContent = b.name;
    const meta = document.createElement("div");
    meta.className = "card-meta";
    const count = document.createElement("span");
    count.textContent = tr("boardCardCount", { n: b.elementCount });
    const edited = document.createElement("span");
    edited.textContent = formatRelativeTime(b.lastEdited);
    meta.appendChild(count);
    meta.appendChild(edited);
    body.appendChild(name);
    body.appendChild(meta);
    card.appendChild(thumb);
    card.appendChild(body);
    card.addEventListener("click", () => switchBoard(b.name));
    boardPop.appendChild(card);
  }
}
function switchBoard(name) {
  if (name && name !== board) {
    closeBoardPop();
    location.search = "?board=" + encodeURIComponent(name);
  }
}
function toggleBoardPop() {
  if (boardPopOpen) closeBoardPop();
  else openBoardPop();
}
async function openBoardPop() {
  boardPopOpen = true;
  boardPop.hidden = false;
  boardSwitcher.setAttribute("aria-expanded", "true");
  await loadBoardList();
}
function closeBoardPop() {
  boardPopOpen = false;
  boardPop.hidden = true;
  boardSwitcher.setAttribute("aria-expanded", "false");
}
/** 把 ms 时间戳格式化为相对时间：刚刚 / x 分钟前 / x 小时前 / x 天前 */
function formatRelativeTime(ms) {
  if (!ms) return "";
  const diff = Date.now() - ms;
  if (diff < 60_000) return tr("boardJustNow") || "刚刚";
  if (diff < 3_600_000) return tr("boardMinAgo", { n: Math.floor(diff / 60_000) });
  if (diff < 86_400_000) return tr("boardHourAgo", { n: Math.floor(diff / 3_600_000) });
  return tr("boardDayAgo", { n: Math.floor(diff / 86_400_000) });
}
// 点击浮层外部关闭（参考 agent-pop 的逻辑）
document.addEventListener("click", (e) => {
  if (!boardPopOpen) return;
  if (boardPop.contains(e.target) || boardSwitcher.contains(e.target)) return;
  closeBoardPop();
});

// ---------- 无限画布 ----------
const svg = document.getElementById("canvas");
const content = document.getElementById("content");
const labelEl = document.getElementById("curLabel");
const progEl = document.getElementById("progress");
const wsDot = document.getElementById("wsDot");
const controlsEl = document.querySelector(".controls");
let vb = { x: 0, y: 0, w: 800, h: 500 };
function applyView() { svg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h); }

// ---------- 摄像机：作画时始终把工蚁保持在镜头中心 ----------
// 画布坐标是世界坐标；摄像机只负责移动 viewBox 的左上角，缩放仍由用户滚轮控制。
const camera = (() => {
  let target = null;
  let frame = null;
  let lastTime = 0;
  const EPSILON = 0.08;

  /**
   * 输入是工蚁笔尖的世界坐标；换算后让工蚁身体中心（不是笔尖）严格落在屏幕中心。
   * 蚂蚁是屏幕像素尺寸，因此偏移需要按当前 viewBox 缩放比例换算成世界坐标。
   */
  function workerCenteredView(point) {
    const rect = svg.getBoundingClientRect();
    const worldPerPxX = vb.w / Math.max(1, rect.width);
    const worldPerPxY = vb.h / Math.max(1, rect.height);
    return {
      x: point.x + (0.5 - ANT_PEN_TIP_RATIO.x) * ANT_SIZE * worldPerPxX - vb.w / 2,
      y: point.y + (0.5 - ANT_PEN_TIP_RATIO.y) * ANT_SIZE * worldPerPxY - vb.h / 2,
    };
  }

  function centerOn(point, immediate = false, elapsed = 16) {
    const next = workerCenteredView(point);
    const x = next.x;
    const y = next.y;
    if (immediate) {
      vb.x = x;
      vb.y = y;
      applyView();
      scheduleSaveView();
      if (typeof syncWorkerScreenPosition === "function") syncWorkerScreenPosition();
      return;
    }
    // 与帧率无关的平滑阻尼：既能跟住快速笔画，也不会瞬移。
    const easing = 1 - Math.pow(0.001, Math.max(1, elapsed) / 1000);
    vb.x += (x - vb.x) * easing;
    vb.y += (y - vb.y) * easing;
    applyView();
    scheduleSaveView();
    if (typeof syncWorkerScreenPosition === "function") syncWorkerScreenPosition();
  }

  function tick(now) {
    frame = null;
    if (!target) return;
    const elapsed = lastTime ? now - lastTime : 16;
    lastTime = now;
    const desired = workerCenteredView(target);
    const desiredX = desired.x;
    const desiredY = desired.y;
    centerOn(target, false, elapsed);
    if (!target || Math.abs(vb.x - desiredX) > EPSILON || Math.abs(vb.y - desiredY) > EPSILON) {
      frame = requestAnimationFrame(tick);
    }
  }

  return {
    /** 更新工蚁的世界坐标目标；下一帧开始平滑追随。 */
    follow(point) {
      target = { x: point.x, y: point.y };
      if (!frame) frame = requestAnimationFrame(tick);
    },
    /** 停止自动跟随，用户可自由浏览；不会改变当前视角。 */
    stop() {
      target = null;
      lastTime = 0;
      if (frame) cancelAnimationFrame(frame);
      frame = null;
    },
    /** 供调试或未来 UI 开关查询当前是否正在跟随。 */
    get following() { return !!target; },
  };
})();

// ---------- 视角保存：每个画板记住上次的 viewBox，刷新/重进后恢复 ----------
function viewKey() { return "handdraw-view:" + board; }
let viewSaveTimer = null;
function scheduleSaveView() {
  clearTimeout(viewSaveTimer);
  viewSaveTimer = setTimeout(() => {
    try { localStorage.setItem(viewKey(), JSON.stringify(vb)); } catch { /* ignore */ }
  }, 250);
}
function restoreView() {
  try {
    const raw = localStorage.getItem(viewKey());
    if (!raw) return;
    const v = JSON.parse(raw);
    if ([v.x, v.y, v.w, v.h].every((n) => Number.isFinite(n)) && v.w >= 50 && v.w <= 800000 && v.h > 0) {
      vb = v;
      applyView();
    }
  } catch { /* ignore */ }
}
function resetView() {
  camera.stop();
  frameContentIntoView();
}
/** 将镜头移动到当前内容；保留少量边距，避免新画内容落在默认视口之外。 */
function frameBBoxIntoView(bb) {
  if (!bb || !bb.width || !bb.height) return;
  const r = svg.getBoundingClientRect();
  const ratio = r.width / Math.max(1, r.height);
  const pad = 70;
  const contentW = bb.width + pad * 2;
  const contentH = bb.height + pad * 2;
  let w = Math.max(50, contentW);
  let h = Math.max(50, contentH);
  if (w / h > ratio) h = w / ratio;
  else w = h * ratio;
  // 不让“适应”把极大画板缩成看不清的缩略图。
  const maxW = 800000;
  if (w > maxW) { w = maxW; h = w / ratio; }
  vb = { x: bb.x + bb.width / 2 - w / 2, y: bb.y + bb.height / 2 - h / 2, w, h };
  applyView();
  scheduleSaveView();
}
function frameContentIntoView() {
  frameBBoxIntoView(content.getBBox());
}
function frameIncomingElementsIntoView(strokes) {
  const ids = new Set(strokes.map((s) => s.elementId).filter(Boolean));
  const groups = [...content.querySelectorAll("g.el")].filter((g) => ids.has(g.getAttribute("data-element-id")));
  if (!groups.length) return;
  let bb = null;
  for (const group of groups) {
    const part = group.getBBox();
    if (!part.width && !part.height) continue;
    if (!bb) bb = { x: part.x, y: part.y, width: part.width, height: part.height };
    else {
      const right = Math.max(bb.x + bb.width, part.x + part.width);
      const bottom = Math.max(bb.y + bb.height, part.y + part.height);
      bb.x = Math.min(bb.x, part.x);
      bb.y = Math.min(bb.y, part.y);
      bb.width = right - bb.x;
      bb.height = bottom - bb.y;
    }
  }
  if (!bb) return;
  const ctm = svg.getScreenCTM();
  if (!ctm) return;
  const p1 = new DOMPoint(bb.x, bb.y).matrixTransform(ctm);
  const p2 = new DOMPoint(bb.x + bb.width, bb.y + bb.height).matrixTransform(ctm);
  const visible = p2.right >= 0 && p1.left <= window.innerWidth && p2.bottom >= 0 && p1.top <= window.innerHeight;
  if (!visible) frameBBoxIntoView(bb);
}
let drag = null;
svg.addEventListener("mousedown", (e) => {

  camera.stop();
  drag = { sx: e.clientX, sy: e.clientY, vx: vb.x, vy: vb.y };
  svg.style.cursor = "grabbing";

// 双击元素 → 弹出说明浮窗

window.addEventListener("mousemove", (e) => {
  if (!drag) return;
  const r = svg.getBoundingClientRect();
  vb.x = drag.vx - ((e.clientX - drag.sx) * vb.w) / r.width;
  vb.y = drag.vy - ((e.clientY - drag.sy) * vb.h) / r.height;

window.addEventListener("mouseup", (e) => {

    const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
    if (moved <= 4) {
      let g = e.target && e.target.closest ? e.target.closest("g.el") : null;
      if (!g || !content.contains(g)) g = pickElementAt(e.clientX, e.clientY); // 空心图形内部的包围盒兜底
      if (g) selectElement(g);

/** 兜底命中：屏幕点 → SVG 坐标，取最上层（DOM 末尾）包围盒包含该点的元素 */
function pickElementAt(clientX, clientY) {
  const ctm = svg.getScreenCTM();
  if (!ctm) return null;
  const pt = new DOMPoint(clientX, clientY).matrixTransform(ctm.inverse());
  const groups = content.querySelectorAll("g.el");
  const pad = 6;
  for (let i = groups.length - 1; i >= 0; i--) {
    try {
      const bb = groups[i].getBBox();
      if (pt.x >= bb.x - pad && pt.x <= bb.x + bb.width + pad && pt.y >= bb.y - pad && pt.y <= bb.y + bb.height + pad) {
        return groups[i];
      }
    } catch { /* 空分组 */ }
  }
  return null;
}
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  // 手动缩放是一次明确的浏览意图，暂停自动镜头，直到下一笔移动。
  camera.stop();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const fx = vb.x + (mx * vb.w) / r.width;
  const fy = vb.y + (my * vb.h) / r.height;
  const f = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  const nw = vb.w * f, nh = vb.h * f;
  if (nw < 50 || nw > 800000) return;
  vb.x = fx - (mx * nw) / r.width;
  vb.y = fy - (my * nh) / r.height;
  vb.w = nw; vb.h = nh;
  applyView();
  scheduleSaveView();
}, { passive: false });
applyView();

// ---------- z-order：每个元素一个 <g>，按 z 排序插入 ----------
function elGroup(elementId, z, root = content) {
  const id = elementId || "";
  let g = root.querySelector(`g.el[data-element-id="${id}"]`);
  if (g) return g;
  g = svgNS("g");
  g.setAttribute("class", "el");
  g.setAttribute("data-element-id", id);
  g.dataset.z = z == null ? "" : String(z);
  const zz = z == null ? Infinity : z;
  for (const other of root.querySelectorAll("g.el")) {
    const oz = other.dataset.z === "" ? Infinity : Number(other.dataset.z);
    if (oz > zz) { root.insertBefore(g, other); return g; }
  }
  root.appendChild(g);
  return g;
}

// ---------- 笔画播放 + 钢笔跟随 ----------
let totalStrokes = 0;
let queue = Promise.resolve(); // 回放和静默刷新使用的保留队列
let wipeSeq = 0;
let canvasEpoch = 0;
const WORKER_IDS = ["worker-1", "worker-2", "worker-3", "worker-4"];

/** 每只工蚁拥有独立笔尖、目标位置和动画队列；队列空闲后自动领取下一批笔画。 */
const workerLanes = new Map(WORKER_IDS.map((id) => [id, { queue: Promise.resolve(), penPos: null, lastTarget: { x: NaN, y: NaN }, epoch: 0 }]));
let penPos = null; // 兼容旧镜头代码；镜头默认不再跟随
let lastAntTarget = { x: NaN, y: NaN }; // 兼容旧单工蚁状态
function laneFor(workerId) {
  return workerLanes.get(workerId) || workerLanes.get("worker-1");
}
function workerElFor(workerId) {
  const existing = workerEls.get(workerId);
  if (existing) return existing;
  // WebSocket 可能早于 initAgent() 收到工蚁笔画；此时也必须即时创建对应 DOM，
  // 不能回退到 worker-1，否则四只工蚁会叠在同一个位置、同一只蚂蚁同时画多块内容。
  if (typeof ensureWorkerElement === "function") return ensureWorkerElement(workerId);
  return workerEl;
}
function invalidateWorkerLanes() {
  canvasEpoch++;
  for (const lane of workerLanes.values()) {
    lane.epoch++;
    lane.penPos = null;
    lane.lastTarget = { x: NaN, y: NaN };
  }
}
function laneIsCurrent(workerId, epoch) {
  return laneFor(workerId).epoch === epoch;
}

function movePen(x, y) {
  movePenFor("worker-1", x, y);
}
function movePenFor(workerId, x, y) {
  const lane = laneFor(workerId);
  lane.penPos = { x, y };
  if (workerId === "worker-1") penPos = lane.penPos;
  // 每只工蚁独立跟随笔尖；不再驱动摄像机。
  if (agentMode && (!Number.isFinite(lane.lastTarget.x) || !Number.isFinite(lane.lastTarget.y) ||
      Math.abs(x - lane.lastTarget.x) > 4 || Math.abs(y - lane.lastTarget.y) > 4)) {
    lane.lastTarget = { x, y };
    moveAntToPenFor(workerId, x, y);
  }
}

/** 工作态中等蚂蚁的 CSS 跟随过渡结束，确保它先落到笔画起点再下笔。 */
function waitForAntArrival(to) {
  return waitForAntArrivalFor("worker-1", to);
}
function waitForAntArrivalFor(workerId, to) {
  if (!agentMode) return Promise.resolve();
  const lane = laneFor(workerId);
  lane.lastTarget = { x: to.x, y: to.y };
  moveAntToPenFor(workerId, to.x, to.y);
  return new Promise((resolve) => setTimeout(resolve, 36));
}

/** 抬笔滑行：从当前位置平滑移到下一笔起点；工作态必须等蚂蚁抵达后才开始画。 */
function glidePen(to) {
  return glidePenFor("worker-1", to);
}
function glidePenFor(workerId, to) {
  const from = laneFor(workerId).penPos;
  if (!from) {
    movePenFor(workerId, to.x, to.y);
    return waitForAntArrivalFor(workerId, to);
  }
  const dist = Math.hypot(to.x - from.x, to.y - from.y);
  if (dist < 24) {
    movePenFor(workerId, to.x, to.y);
    return waitForAntArrivalFor(workerId, to);
  }
  // 画画蚂蚁的抬笔移动稍慢一点，给用户清晰的“移动 → 落笔”节奏。
  const dur = Math.min(150, 40 + dist * 0.15);
  const startT = performance.now();
  return new Promise((resolve) => {
    function frame(now) {
      const t = Math.min(1, (now - startT) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      movePenFor(workerId, from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e);
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        // 先准确落位，再等待蚂蚁完成最后一小段追随。
        waitForAntArrivalFor(workerId, to).then(resolve);
      }
    }
    requestAnimationFrame(frame);
  });
}

function svgNS(tag) { return document.createElementNS("http://www.w3.org/2000/svg", tag); }

/** 播放单个笔画（写出来 + 钢笔跟随） */
async function playStroke(s, workerId = "worker-1", epoch = laneFor(workerId).epoch) {
  if (!laneIsCurrent(workerId, epoch)) return false;
  // turbo 笔画会下发 26ms；以 40ms 作为浏览器可见动画下限，
  // 同时配合更短的落笔/抬笔节奏，中文逐笔画总时长约为旧版的一半。
  const dur = Math.max(40, s.dur || 300);
  const group = elGroup(s.elementId, s.z);
  // 字体文字（拉丁/符号）：擦除式显出——从左到右揭开，笔尖跟着写出前沿走，
  // 保留原字体的美观，又不像淡入那样"跳出来"
  if (s.isText) {
    const g = svgNS("g");
    g.innerHTML = s.d;
    group.appendChild(g);
    const bb = g.getBBox();
    const pad = Math.max(2, bb.height * 0.1);
    const clipId = `wipe${++wipeSeq}`;
    const clip = svgNS("clipPath");
    clip.setAttribute("id", clipId);
    const rect = svgNS("rect");
    rect.setAttribute("x", bb.x - pad);
    rect.setAttribute("y", bb.y - pad);
    rect.setAttribute("width", "0");
    rect.setAttribute("height", bb.height + pad * 2);
    clip.appendChild(rect);
    group.appendChild(clip);
    g.setAttribute("clip-path", `url(#${clipId})`);

    const wipeDur = Math.max(40, dur);
    const startX = bb.x - pad;
    const full = bb.width + pad * 2;
    const penY = bb.y + bb.height * 0.72; // 笔尖贴在基线附近
    // 等蚂蚁抵达文字起点后，才开始揭开文字。
    await glidePenFor(workerId, { x: startX, y: penY });
    if (!laneIsCurrent(workerId, epoch)) { group.remove(); return false; }
    const startT = performance.now();
    return new Promise((resolve) => {
      function frame(now) {
        if (!laneIsCurrent(workerId, epoch)) { group.remove(); resolve(false); return; }
        const t = Math.min(1, (now - startT) / wipeDur);
        rect.setAttribute("width", String(full * t));
        movePenFor(workerId, startX + full * t, penY);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          g.removeAttribute("clip-path"); // 显完去掉裁剪，不留残留节点
          clip.remove();
          resolve(true);
        }
      }
      requestAnimationFrame(frame);
    });
  }
  const p = svgNS("path");
  p.setAttribute("d", s.d);
  p.setAttribute("stroke-linecap", "round");
  p.setAttribute("stroke-linejoin", "round");
  if (s.hatch) {
    // 填充斜线：所有线合并为一条 path，整体快速生长，笔尖不跟随
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", s.color);
    p.setAttribute("stroke-width", s.width);
    group.appendChild(p);
    const hlen = p.getTotalLength();
    p.style.strokeDasharray = hlen;
    p.style.strokeDashoffset = hlen;
    // 填充斜线没有逐段笔尖轨迹，也仍需等蚂蚁先抵达该组笔画的起点。
    await glidePenFor(workerId, p.getPointAtLength(0));
    if (!laneIsCurrent(workerId, epoch)) { group.remove(); return false; }
    const hatchDur = Math.max(40, dur);
    p.style.transition = `stroke-dashoffset ${hatchDur}ms ease-out`;
    requestAnimationFrame(() => { p.style.strokeDashoffset = "0"; });
    return new Promise((resolve) => setTimeout(() => {
      if (!laneIsCurrent(workerId, epoch)) { group.remove(); resolve(false); } else resolve(true);
    }, hatchDur));
  }
  if (s.fill) {
    // 填充图形（箭头尖）：淡入
    p.setAttribute("fill", s.fill);
    p.setAttribute("stroke", "none");
    p.style.opacity = "0";
    group.appendChild(p);
    // 箭头尖等填充元素也遵守“先到位、后落笔”的节奏。
    if (p.getTotalLength() > 0) await glidePenFor(workerId, p.getPointAtLength(0));
    if (!laneIsCurrent(workerId, epoch)) { group.remove(); return false; }
    const fillDur = Math.max(40, dur);
    p.style.transition = `opacity ${fillDur}ms`;
    requestAnimationFrame(() => { p.style.opacity = "1"; });
    return new Promise((resolve) => setTimeout(() => {
      if (!laneIsCurrent(workerId, epoch)) { group.remove(); resolve(false); } else resolve(true);
    }, fillDur));
  }
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", s.color);
  p.setAttribute("stroke-width", s.width);
  group.appendChild(p);

  const len = p.getTotalLength();
  // dash 生长动画
  p.style.strokeDasharray = len;
  p.style.strokeDashoffset = len;

  // 先抬笔滑行到本笔起点并等蚂蚁落笔，再启动真实笔画的出现动画。
  await glidePenFor(workerId, p.getPointAtLength(0));
  if (!laneIsCurrent(workerId, epoch)) { group.remove(); return false; }
  const drawDur = Math.max(40, dur);
  p.style.transition = `stroke-dashoffset ${drawDur}ms linear`;
  requestAnimationFrame(() => { p.style.strokeDashoffset = "0"; });

  const startT = performance.now();
  return new Promise((resolve) => {
    function frame(now) {
      if (!laneIsCurrent(workerId, epoch)) { group.remove(); resolve(false); return; }
      const t = Math.min(1, (now - startT) / drawDur);
      const pt = p.getPointAtLength(len * t);
      movePenFor(workerId, pt.x, pt.y);
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        p.style.strokeDashoffset = 0;
        resolve(true);
      }
    }
    requestAnimationFrame(frame);
  });
}

/** 静态落笔（无动画）：用于刷新/重连后的历史回放 */
function drawStrokeInstant(s, root = content) {
  totalStrokes++;
  const group = elGroup(s.elementId, s.z, root);
  if (s.image) {
    // 图片元素：直接渲染 <image>，无笔画动画
    const img = svgNS("image");
    img.setAttribute("x", s.image.x);
    img.setAttribute("y", s.image.y);
    img.setAttribute("width", s.image.w);
    img.setAttribute("height", s.image.h);
    img.setAttribute("href", s.image.src);
    img.setAttribute("preserveAspectRatio", "xMidYMid meet");
    group.appendChild(img);
    return;
  }
  if (s.isText) {
    const g = svgNS("g");
    g.innerHTML = s.d;
    group.appendChild(g);
    return;
  }
  const p = svgNS("path");
  p.setAttribute("d", s.d);
  p.setAttribute("stroke-linecap", "round");
  p.setAttribute("stroke-linejoin", "round");
  if (s.fill) {
    p.setAttribute("fill", s.fill);
    p.setAttribute("stroke", "none");
  } else {
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", s.color);
    p.setAttribute("stroke-width", s.width);
  }
  group.appendChild(p);
}

function renderInstant(strokes) {
  // 重连时服务器会重放全量历史，先清空避免重复叠加。
  // 静态恢复不应让工作队列的 epoch 失效，否则恢复后的新笔画会被整批跳过。
  strokeSeq++;
  content.innerHTML = "";
  totalStrokes = 0;
  for (const s of strokes) drawStrokeInstant(s);
  progEl.textContent = totalStrokes + tr("strokeUnit");
  penPos = null;
  // 首次恢复时若已有内容不在当前视口，再把镜头带过去；用户已有的可见视角不被覆盖。
  requestAnimationFrame(() => frameIncomingElementsIntoView(strokes));
}

// ---------- 动画回放：按原始书写时长把全量笔画重新播放一遍 ----------
let replaying = false;
async function replayCanvas() {
  if (replaying) return;
  if (document.body.classList.contains("agent-working") || drawingJobs > 0) { labelEl.textContent = tr("replayBusy"); return; }
  let strokes;
  try {
    const res = await fetch("/api/strokes?board=" + encodeURIComponent(board));
    const data = await res.json();
    if (!Array.isArray(data.strokes) || data.strokes.length === 0) return;
    strokes = data.strokes;
  } catch { return; }
  replaying = true;
  beginDrawing();
  invalidateWorkerLanes();
  strokeSeq++; // 让进行中的静默刷新失效，避免把回放冲掉
  deselect();
  content.innerHTML = "";
  totalStrokes = 0;
  penPos = null;
  progEl.textContent = "0" + tr("strokeUnit");
  // 排在当前队列后面：正在播放的笔画播完再开始回放
  const replayEpoch = canvasEpoch;
  queue = queue.then(async () => {
    controlsEl.classList.add("dim");
    try {
      for (const s of strokes) {
        if (canvasEpoch !== replayEpoch) return;
        showObjectDescription(s);
        if (s.image) { drawStrokeInstant(s); continue; } // 图片直接出现
        totalStrokes++;
        progEl.textContent = totalStrokes + tr("strokeUnit");
        labelEl.textContent = "▶ " + (s.label || tr("replaying"));
        showObjectDescription(s);
        const replayWorkerId = WORKER_IDS.includes(s.workerId) ? s.workerId : "worker-1";
        await playStroke(s, replayWorkerId, laneFor(replayWorkerId).epoch);
      }
      labelEl.textContent = tr("replayDone");
      penPos = null;
    } finally {
      controlsEl.classList.remove("dim");
      replaying = false;
      finishDrawingIfIdle();
    }
  });
}

/** 状态→中文短标签 */
function workerStatusLabel(status) {

    idle: "待命",

/**
 * 在画布 overlay 上画/更新某个 worker 的区域框。
 * - region 为 null → 立即清除该 worker 的旧框
 * - region 存在 + status 是 drawing/starting → 持久显示（不淡出）
 * - region 存在 + status 是 done/idle → 画完后 2.5s 淡出
 */
function drawWorkerRegion(workerId, region, status) {
  const layer = document.getElementById("overlay");
  if (!layer) return;
  // 先清掉该 worker 旧的可视化节点
  layer.querySelectorAll(`[data-worker-region="${CSS.escape(workerId)}"]`).forEach((n) => n.remove());
  if (!region || typeof region.x !== "number") return;
  const num = workerId.match(/\d+/)?.[0] || "1";
  const persistent = status === "drawing" || status === "starting";
  const rect = svgNS("rect");
  rect.setAttribute("x", region.x);
  rect.setAttribute("y", region.y);
  rect.setAttribute("width", region.w);
  rect.setAttribute("height", region.h);
  rect.setAttribute("rx", "8");
  rect.setAttribute("class", `worker-region-rect w${num}${persistent ? "" : " fading"}`);
  rect.setAttribute("data-worker-region", workerId);
  layer.appendChild(rect);
  const label = svgNS("text");
  label.setAttribute("x", region.x + 8);
  label.setAttribute("y", region.y + 18);
  label.setAttribute("class", `worker-region-label${persistent ? "" : " fading"}`);
  label.setAttribute("data-worker-region", workerId);
  label.textContent = `${workerId} · ${workerStatusLabel(status)}`;
  layer.appendChild(label);
  // 非持久态：动画结束后清理 DOM，避免 overlay 节点堆积
  if (!persistent) {
    setTimeout(() => {
      rect.remove();
      label.remove();
    }, 3200);
  }

/** 笔画版本号：fetch 期间若有新笔画到达则放弃本次刷新（下一次 agent 结束还会再刷） */
let strokeSeq = 0;
let refreshQueued = false;
function scheduleSilentRefresh() {
  if (refreshQueued) return;
  refreshQueued = true;
  // 排在笔画播放队列后面：等正在播放的动画画完再刷，用户无感知
  queue = queue.then(() => {
    refreshQueued = false;
    return silentRefresh();
  });
}
async function silentRefresh() {
  try {
    const seq = strokeSeq;
    const res = await fetch("/api/strokes?board=" + encodeURIComponent(board));
    const data = await res.json();
    if (!Array.isArray(data.strokes)) return;
    if (seq !== strokeSeq) return;
    deselect();
    // 先在屏外分组里渲染完，再一次同步替换，避免闪烁
    totalStrokes = 0;
    const tmp = svgNS("g");
    for (const s of data.strokes) drawStrokeInstant(s, tmp);
    content.innerHTML = "";
    while (tmp.firstChild) content.appendChild(tmp.firstChild);
    progEl.textContent = totalStrokes + tr("strokeUnit");
    penPos = null;
    elMetaCache = null;
  } catch { /* 静默刷新失败不影响使用 */ }
}

/** 处理一批笔画（顺序播放），播放期间淡出底栏避免遮挡 */
let drawingJobs = 0;
let shownDescriptionFor = null;
let streamingObjectDesc = false;
// 收集一轮异步绘图新增的元素，工蚁全部完成后一次性把整批内容带入视野，避免逐个区域跳镜头。
const incomingElementIds = new Set();
function beginDrawing() {
  drawingJobs++;
  if (agentMode) setAntStatus("working");
}
function showObjectDescription(s) {
  if (!agentMode || !s.desc || shownDescriptionFor === s.elementId) return;
  shownDescriptionFor = s.elementId;
  // 描述与产生该元素的 worker 绑定；每只工蚁独立气泡，desc 贴在那只工蚁旁边。
  const descWorkerId = WORKER_IDS.includes(s.workerId) ? s.workerId : "worker-1";
  streamObjectDescription(s.desc, descWorkerId);
}
/** 当前队列完成后立即收起对象说明；agent 仍在思考时不会循环展示聊天文本。 */
function finishDrawingIfIdle() {
  drawingJobs = Math.max(0, drawingJobs - 1);
  if (drawingJobs > 0) return;
  shownDescriptionFor = null;
  // 不截断仍在逐字输出的 desc；它完成后会自行收起。
  if (streamingObjectDesc) return;
  // 队列结束时所有工蚁气泡都收；hideSpeech() 会停蚁后，不能调。
  hideAllWorkerSpeeches();
  if (!replaying && agentMode) setAntStatus(agentWorking ? "thinking" : "idle");
}
function handleStrokes(strokes) {
  for (const stroke of strokes) if (stroke.elementId) incomingElementIds.add(stroke.elementId);
  strokeSeq++;
  beginDrawing();
  const byWorker = new Map();
  for (const stroke of strokes) {
    const id = WORKER_IDS.includes(stroke.workerId) ? stroke.workerId : "worker-1";
    if (!byWorker.has(id)) byWorker.set(id, []);
    byWorker.get(id).push(stroke);
  }
  const jobs = [];
  for (const [workerId, laneStrokes] of byWorker) {
    const lane = laneFor(workerId);
    const epoch = lane.epoch;
    lane.queue = lane.queue.then(async () => {
      workerElFor(workerId).classList.add("busy");
      try {
        if (!laneIsCurrent(workerId, epoch)) return;
        for (const s of laneStrokes) {
          if (!laneIsCurrent(workerId, epoch)) return;
          if (s.image) {
            showObjectDescription(s);
            drawStrokeInstant(s);
            continue;
          }
          totalStrokes++;
          progEl.textContent = totalStrokes + tr("strokeUnit");
          labelEl.textContent = `✏️ ${s.label || "绘制"} · ${workerId}`;
          showObjectDescription(s);
          await playStroke(s, workerId, epoch);
        }
      } finally {
        workerElFor(workerId).classList.remove("busy");
      }
    });
    jobs.push(lane.queue);
  }
  Promise.all(jobs).then(() => {
    labelEl.textContent = tr("batchDone");
    // 先递减 drawingJobs；只有整轮异步绘图都结束后，才一次性定位到新增内容。
    finishDrawingIfIdle();
    if (drawingJobs === 0 && incomingElementIds.size) {
      const ids = [...incomingElementIds].map((elementId) => ({ elementId }));
      incomingElementIds.clear();
      requestAnimationFrame(() => frameIncomingElementsIntoView(ids));
    }
  }).catch(() => {
    finishDrawingIfIdle();
    if (drawingJobs === 0 && incomingElementIds.size) {
      const ids = [...incomingElementIds].map((elementId) => ({ elementId }));
      incomingElementIds.clear();
      requestAnimationFrame(() => frameIncomingElementsIntoView(ids));
    }
  });
}

// ---------- WebSocket 实时接收 ----------
let ws = null;
/** Agent 工作呼吸灯：思考+作画期间点亮（AIPex 风格三点脉冲 + 整页呼吸光环） */
const agentPulse = document.getElementById("agentPulse");
/** 本页面观察到过 agent 工作才触发结束后的静默刷新（连接时的状态同步不触发） */
let sawAgentWorking = false;
function setAgentLight(working) {
  document.body.classList.toggle("agent-working", working);
  agentPulse.hidden = !working;
}
/** 连接后收到的第一批 = 服务器回放的历史内容，直接静态渲染，不重新播放动画 */
let expectReplay = true;
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?board=${encodeURIComponent(board)}`);
  window.__wsState = "connecting";
  ws.onopen = () => { window.__wsState = "open"; wsDot.className = "dot on"; labelEl.textContent = tr("waiting"); };
  ws.onmessage = (ev) => {
    window.__msgCount = (window.__msgCount || 0) + 1;
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "agent") {
        agentWorking = !!msg.working;
        setAgentLight(agentWorking);
        // 收到 agent 开始工作先进入左下角思考态；只有实际笔画队列/回放才切换为镜头跟随的作画态。
        if (drawingJobs > 0 || replaying || streamingObjectDesc) setAntStatus("working");
        else setAntStatus(agentWorking ? "thinking" : "idle");
        if (msg.working) sawAgentWorking = true;
        else if (sawAgentWorking) { sawAgentWorking = false; scheduleSilentRefresh(); }
        return;
      }
      if (msg.type === "speech") {
        // text 默认是蚁后流；带 workerId 则路由到该工蚁独立气泡。
        const kind = msg.kind === "thinking" ? "thinking" : "text";
        if (msg.workerId && WORKER_IDS.includes(msg.workerId)) {
          showWorkerStream(msg.workerId, msg.full ?? "", { kind });
          if (msg.done) finishWorkerStreamDisplay(msg.workerId);
        } else {
          // 蚁后文本流：始终显示在左下角蚁后气泡，不再被工蚁绘图状态覆盖。
          showQueenStream(msg.full ?? "", { kind });
          if (msg.done) finishQueenStreamDisplay();
        }
        return;
      }
      if (msg.type === "workers") {
        for (const worker of msg.workers || []) {
          const el = workerElFor(worker.id);
          el.classList.toggle("busy", worker.status === "drawing" || worker.status === "starting");
          el.dataset.workerStatus = worker.status;
          el.dataset.taskId = worker.taskId || "";
          // 工蚁分配区域可视化：仅在 region 存在时画虚线框；空 region 视为清除
          drawWorkerRegion(worker.id, worker.region ?? null, worker.status);
        }
        return;
      }
      elMetaCache = null; // 画布有变动，元素元数据缓存失效
      if (msg.type === "clear") { expectReplay = false; clearCanvas(); return; }
      if (msg.type === "remove") {
        expectReplay = false;
        content.querySelectorAll(`g.el[data-element-id="${msg.elementId}"]`).forEach((el) => el.remove());
        if (msg.elementId === selectedId) deselect();
        labelEl.textContent = tr("removedEl", { id: msg.elementId });
        return;
      }
      if (msg.type === "update") {
        expectReplay = false;
        content.querySelectorAll(`g.el[data-element-id="${msg.elementId}"]`).forEach((el) => el.remove());
        if (msg.elementId === selectedId) deselect();
        handleStrokes(msg.strokes.map((s) => ({ ...s, elementId: msg.elementId, z: msg.z ?? s.z })));
        return;
      }
      if (msg.type === "batch") {
        if (expectReplay) { expectReplay = false; renderInstant(msg.strokes); labelEl.textContent = tr("restored"); return; }
        handleStrokes(msg.strokes);
        return;
      }
      if (msg.type === "stroke") { expectReplay = false; handleStrokes([msg]); return; }
    } catch (e) {
      window.__lastErr = e.message;
    }
  };
  ws.onclose = () => {
    window.__wsState = "closed";
    setAgentLight(false);
    expectReplay = true; // 重连后服务器会再次回放全量历史
    wsDot.className = "dot off";
    labelEl.textContent = tr("disconnected");
    setTimeout(connect, 1500);
  };
  ws.onerror = () => { window.__wsState = "error"; ws.close(); };
}

  if (top + popH > window.innerHeight - 8) top = window.innerHeight - popH - 8;
  if (top < 8) top = 8;
  setPopPosition(inputPop, left, top, rect.left + rect.width / 2, rect.top + rect.height / 2);
}
function openInputPop(prefill) {
  if (!agentMode || antStatus === "working") return;
  // 输入、历史和提示气泡互斥。
  closeHistoryPop({ restoreSpeech: false });
  hideSpeech();
  inputPop.hidden = false;
  document.body.classList.add("input-open"); // CSS：蚂蚁不能点击
  inputErr.textContent = "";
  if (typeof prefill === "string") inputText.value = prefill;
  else inputText.value = "";
  requestAnimationFrame(() => {
    positionInputPop();
    popFromAnt(inputPop);
    inputText.focus();
  });
}
function closeInputPop({ restoreSpeech = true } = {}) {
  inputPop.hidden = true;
  document.body.classList.remove("input-open");
  if (restoreSpeech) restoreIdleSpeech();
}
async function submitInput() {
  const text = inputText.value.trim();
  if (!text) return;
  if (chatBusy) { inputErr.textContent = tr("inputErrBusy"); return; }
  inputErr.textContent = "";
  chatBusy = true;
  inputSend.disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, board }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      inputErr.textContent = "⚠️ " + (err.error || ("HTTP " + res.status));
      return;
    }
    // 提交成功：清空输入文本，保留输入浮窗打开（用户主动关）
    // 不调用 closeInputPop()，让用户继续编辑下一条或主动关
    inputText.value = "";
    // 提交后由 ws 收到 {type:"agent","working":true} 切换到工作状态
    // 提交后由 ws 收到 {type:"agent",working:true} 切换到工作状态
  } catch {
    inputErr.textContent = tr("inputErrNet");
  } finally {
    chatBusy = false;
    inputSend.disabled = false;
  }
}
inputSend.addEventListener("click", submitInput);
inputClose.addEventListener("click", closeInputPop);
inputText.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submitInput(); }
});

// ---------- 历史浮窗 ----------
function positionHistoryPop() {
  const rect = antEl.getBoundingClientRect();
  const popW = historyPop.offsetWidth;
  const popH = historyPop.offsetHeight;
  // 默认在蚂蚁左侧
  let left = rect.left - popW - 16;
  let top = rect.top - 16;
  if (left < 8) left = rect.right + 16;
  if (left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
  if (top + popH > window.innerHeight - 8) top = window.innerHeight - popH - 8;
  if (top < 8) top = 8;
  setPopPosition(historyPop, left, top, rect.left + rect.width / 2, rect.top + rect.height / 2);
}
async function openHistoryPop() {
  if (!agentMode) return;
  // 输入、历史和提示气泡互斥。
  closeInputPop({ restoreSpeech: false });
  hideSpeech();
  historyPop.hidden = false;
  historyMsgs.innerHTML = '<div class="empty">' + tr("historyEmpty") + "</div>";
  historyCount.textContent = "";
  requestAnimationFrame(() => {
    positionHistoryPop();
    popFromAnt(historyPop);
  });
  try {
    const res = await fetch("/api/chat/history?board=" + encodeURIComponent(board));
    const data = await res.json();
    const msgs = data.messages ?? [];
    historyMsgs.innerHTML = "";
    if (!msgs.length) {
      historyMsgs.innerHTML = '<div class="empty">' + tr("historyEmpty") + "</div>";
    } else {
      for (const m of msgs) {
        const div = document.createElement("div");
        div.className = "msg " + (m.role || "agent");
        const role = document.createElement("span");
        role.className = "msg-role";
        role.textContent = m.role === "user" ? "用户" : m.role === "agent" ? "蚁后" : m.role === "worker" ? "工蚁调度" : "系统";
        div.appendChild(role);
        const body = document.createElement("span");
        body.textContent = m.content || (m.role === "agent" ? "思考中…" : "（处理中）");
        div.appendChild(body);
        historyMsgs.appendChild(div);
      }
      historyMsgs.scrollTop = historyMsgs.scrollHeight;
    }
    historyCount.textContent = msgs.length ? `· ${msgs.length} 条` : "";
    requestAnimationFrame(positionHistoryPop);
  } catch {
    historyMsgs.innerHTML = '<div class="empty">⚠️ ' + tr("netErr") + "</div>";
  }
}
function closeHistoryPop({ restoreSpeech = true } = {}) {
  historyPop.hidden = true;
  if (restoreSpeech) restoreIdleSpeech();
}
historyClose.addEventListener("click", closeHistoryPop);

// 点击空白处关闭浮窗
document.addEventListener("mousedown", (e) => {
  if (!inputPop.hidden && !inputPop.contains(e.target) && !antEl.contains(e.target)) {
    // 不关闭：如果点击是画布上的双击元素逻辑
  }
  if (!historyPop.hidden && !historyPop.contains(e.target) && !antEl.contains(e.target)) {
    closeHistoryPop();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!inputPop.hidden) closeInputPop();
    else if (!historyPop.hidden) closeHistoryPop();
  }
});

// ---------- agent 模式探测 ----------
async function initAgent() {
  try {
    const res = await fetch("/api/agent/info");
    if (!res.ok) return;
    const info = await res.json();
    if (!info.ok) return;
    agentMode = true;
    antEl.hidden = false;
    ensureWorkerElements();
    for (const el of workerEls.values()) el.hidden = false;
    fetch("/api/workers?board=" + encodeURIComponent(board)).then((res) => res.json()).then((data) => {
      for (const worker of data.workers || []) {
        const el = workerElFor(worker.id);
        el.classList.toggle("busy", worker.status === "drawing" || worker.status === "starting");
        el.dataset.workerStatus = worker.status;
        el.dataset.taskId = worker.taskId || "";
      }
    }).catch(() => {});
    // 蚁后和四个工蚁从启动起始终可见：蚁后左下角，工蚁排在右下角。
    moveQueenToCorner();
    moveWorkerToCorner();
    // WebSocket 可能在 agentMode 初始化前就发来 working 状态；这里再次按最新状态同步，
    // 确保蚁后的初始气泡不会因为竞态而一直隐藏。
    setAntStatus(agentWorking ? "thinking" : "idle", { force: true });
    // 窗口缩放时保持两只蚂蚁各自的落点；作画中的工蚁仍贴笔尖。
    window.addEventListener("resize", () => {
      moveQueenToCorner();
      if (antStatus === "working" && penPos) moveAntToPen(penPos.x, penPos.y);
      else moveWorkerToCorner();
    });
  } catch { /* 非 agent 模式，蚂蚁隐藏 */ }
}
initAgent();
initBoard();
</script>
